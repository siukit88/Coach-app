<script>
    function startLoadingData() {
        document.getElementById('loading-status').style.display = 'block';
        var finalUrl = csvMainUrl + (csvMainUrl.indexOf('?') !== -1 ? '&' : '?') + "t=" + new Date().getTime();
        
        fetch(finalUrl)
            .then(function(res) { return res.text(); })
            .then(function(text) {
                if(!text || text.trim() === "" || text.length < 10) {
                    var backupUrl = csvBackupUrl + "&t=" + new Date().getTime();
                    return fetch(backupUrl).then(function(r){return r.text();});
                }
                return text;
            })
            .then(function(text) { cachedCsvText = text; parseAndFilterData(); })
            .catch(function() { document.getElementById('loading-status').innerText = "❌ 雲端安全同步失敗。"; });
    }

    function parseStandardCSV(csvText) {
        var lines = []; var currentLine = []; var currentCell = ''; var inQuotes = false;
        var normalized = csvText.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
        for (var i = 0; i < normalized.length; i++) {
            var c = normalized[i];
            if (c === '"') { inQuotes = !inQuotes; }
            else if (c === ',' && !inQuotes) { currentLine.push(currentCell.trim()); currentCell = ''; }
            else if (c === '\n' && !inQuotes) { currentLine.push(currentCell.trim()); lines.push(currentLine); currentLine = []; currentCell = ''; }
            else { currentCell += c; }
        }
        if (currentCell || currentLine.length > 0) { currentLine.push(currentCell.trim()); lines.push(currentLine); }
        return lines;
    }

    function parseAndFilterData() {
        try {
            var lines = parseStandardCSV(cachedCsvText);
            var weekSelect = document.getElementById('filter-week');
            var nameSelect = document.getElementById('filter-name');

            var targetName = nameSelect.value ? nameSelect.value.trim() : "";
            if(targetName.indexOf("👤 學員：") !== -1) { targetName = targetName.replace("👤 學員：", ""); }
            var cleanTarget = targetName.replace(/\s+/g, "").toLowerCase();
            
            allRecords = []; var weeks = {};
            
            if(lines && lines.length > 1) {
                // 📊 完美的物理欄位下標鎖定：
                var idxName = 1; var idxPwdPack = 2; var idxWeek = 3; var idxDist = 4; var idxClimb = 5;
                var idxTime = 6; var idxCadence = 7; var idxHr = 8; var idxStride = 9;
                var idxRisk = 10; var idxWeather = 11; var idxSupply = 12; var idxComment = 13; // M 欄或 N 欄

                // 檢查是否有「時間戳記」平移情況
                if (lines[0][0] && lines[0][0].indexOf("時間戳記") === -1 && lines[0][1] && lines[0][1].indexOf("時間戳記") !== -1) {
                    idxName = 2; idxPwdPack = 3; idxWeek = 4; idxDist = 5; idxClimb = 6; idxTime = 7; idxCadence = 8; idxHr = 9; idxStride = 10;
                    idxRisk = 11; idxWeather = 12; idxSupply = 13; idxComment = 14;
                }

                for(var i = 1; i < lines.length; i++) {
                    var row = lines[i];
                    if(row && row.length > idxName && row[idxName]) {
                        var cleanCellName = row[idxName].replace(/\s+/g, "").toLowerCase();
                        if(cleanCellName === cleanTarget || (cleanTarget === "nein" && cleanCellName === "nien") || (cleanTarget === "nien" && cleanCellName === "nein") || (cleanTarget === "wing_ptl" && cleanCellName === "wing") || (cleanTarget === "jason_ptl" && cleanCellName === "jason")) {
                            
                            var wValue = row[idxWeek] ? row[idxWeek].toString().trim() : "第1週";
                            
                            // 💡 修正Bug：這裡安全使用固定下標與防呆
                            var rawCommentVal = "";
                            if (row.length > idxComment) {
                                rawCommentVal = row[idxComment] || "";
                            }
                            
                            // 避免誤把帶有特殊括號的密碼包當成評語
                            if(rawCommentVal && rawCommentVal.indexOf('[') !== -1 && rawCommentVal.indexOf(']') !== -1) { rawCommentVal = ""; } 

                            allRecords.push({ 
                                timestamp: row[0]||"--", name: row[idxName].trim(), week: wValue, rawPwd: row[idxPwdPack]||"--",
                                distance: row[idxDist]||"0", time: row[idxTime]||"--", cadence: row[idxCadence]||"0", 
                                stride: row[idxStride]||"0", hr: row[idxHr]||"0", 
                                risk: (row.length > idxRisk ? row[idxRisk] : "") || "良好", 
                                weather: (row.length > idxWeather ? row[idxWeather] : "") || "舒適常溫", 
                                supply: (row.length > idxSupply ? row[idxSupply] : "") || "補給正常", 
                                climb: row[idxClimb]||"0",
                                coachComment: rawCommentVal || ""
                            });
                            weeks[wValue] = true;
                        }
                    }
                }
            }

            weekSelect.innerHTML = '<option value="">選擇週數...</option>';
            // 週數智慧排序
            Object.keys(weeks).sort(function(a,b){
                var numA = parseInt(a.match(/\d+/)) || 0;
                var numB = parseInt(b.match(/\d+/)) || 0;
                return numA - numB;
            }).forEach(function(w) { 
                var displayW = w.indexOf("第") !== -1 ? w : "第 " + w + " 週";
                weekSelect.innerHTML += '<option value="' + w + '">' + displayW + '</option>'; 
            });
            
            document.getElementById('loading-status').style.display = 'none';
            if(allRecords && allRecords.length > 0) { 
                var last = allRecords[allRecords.length - 1]; 
                if(last) { weekSelect.value = last.week; updateDisplay(last.week); }
            } else { clearDisplayFields(); }
        } catch (error) { document.getElementById('loading-status').innerText = "❌ 數據安全解析錯誤。"; }
    }

    function clearDisplayFields() {
        document.getElementById('val-date').innerText = "--"; document.getElementById('val-distance').innerText = "--"; 
        document.getElementById('val-time').innerText = "--"; document.getElementById('val-cadence').innerText = "--"; 
        document.getElementById('val-stride').innerText = "--"; document.getElementById('val-hr').innerText = "--";
        document.getElementById('val-risk').innerText = "--"; document.getElementById('val-weather').innerText = "--";
        document.getElementById('val-supply').innerText = "--"; document.getElementById('val-climb').innerText = "--";
        document.getElementById('val-eph').innerText = "--"; document.getElementById('val-raw-pwd').innerText = "--";
        document.getElementById('coach-comment-zone').style.display = 'none';
    }

    function cleanStringToHours(timeStr) {
        if (!timeStr) return 0;
        var tenderness = timeStr.trim();
        var match = tenderness.match(/([0-9]{1,2}):([0-9]{2}):([0-9]{2})/);
        if (match) { return parseInt(match[1]) + (parseInt(match[2]) / 60) + (parseInt(match[3]) / 3600); }
        return 0;
    }

    function updateDisplay(selectedWeek) {
        if(!allRecords || allRecords.length === 0) return;
        var matched = allRecords.find(function(r) { return r.week === selectedWeek; });
        if (matched) {
            document.getElementById('val-date').innerText = matched.timestamp.split(' ')[0] || matched.timestamp;
            document.getElementById('val-distance').innerText = matched.distance + " km"; 
            document.getElementById('val-time').innerText = matched.time; 
            document.getElementById('val-cadence').innerText = matched.cadence + " spm"; 
            document.getElementById('val-stride').innerText = matched.stride + " m";
            document.getElementById('val-hr').innerText = matched.hr + " bpm";
            document.getElementById('val-climb').innerText = matched.climb + " 米";
            document.getElementById('val-raw-pwd').innerText = matched.rawPwd;

            document.getElementById('val-risk').innerText = matched.risk;
            document.getElementById('val-weather').innerText = matched.weather;
            document.getElementById('val-supply').innerText = matched.supply;

            // 📢 智慧導師評語動態渲染
            var commentZone = document.getElementById('coach-comment-zone');
            var commentTextElem = document.getElementById('val-coach-comment');
            var titleTextElem = document.getElementById('comment-title-text');
            
            if (matched.coachComment && matched.coachComment.trim() !== "") {
                commentZone.style.display = 'block';
                titleTextElem.innerText = "💡 Kit Coach 對 " + matched.name + " (" + selectedWeek + ") 的指導：";
                commentTextElem.innerText = matched.coachComment;
            } else {
                commentZone.style.display = 'block';
                titleTextElem.innerText = "📋 看板提示";
                commentTextElem.innerHTML = "<span style='color:#888; font-style:italic;'>教練尚未對此週輸入指導評語，或該週功課剛上載。</span>";
            }

            var distNum = parseFloat(matched.distance) || 0;
            var climbNum = parseFloat(matched.climb) || 0;
            var hoursNum = cleanStringToHours(matched.time);
            if (hoursNum > 0) {
                document.getElementById('val-eph').innerText = ((distNum + (climbNum / 100)) / hoursNum).toFixed(2) + " EP/小時";
            } else { document.getElementById('val-eph').innerText = "--"; }

            var hrNum = parseInt(matched.hr) || 0; var hrBar = document.getElementById('hr-bar');
            if(hrBar && hrNum > 0) {
                var p
