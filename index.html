<!DOCTYPE html>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #121212; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; color: #ffffff; }
        .phone-container { width: 100%; max-width: 412px; min-height: 100vh; background: #16161a; margin: 0 auto; padding-bottom: 40px; text-align: left; box-sizing: border-box; }
        .header { background: #ff3366; padding: 25px 20px; }
        .header h1 { margin: 0; font-size: 22px; font-weight: bold; }
        .header p { margin: 5px 0 0 0; font-size: 13px; color: rgba(255,255,255,0.8); }
        .card { background: #22222b; margin: 15px; padding: 20px; border-radius: 8px; }
        .card h2 { margin: 0 0 15px 0; font-size: 16px; color: #ffffff; border-left: 4px solid #ff3366; padding-left: 8px; }
        .filter-zone { display: flex; gap: 10px; margin-top: 10px; }
        .filter-select { flex: 1; background: #2a2a35; border: 1px solid #ff3366; color: #ffffff; padding: 8px; border-radius: 4px; font-size: 14px; outline: none; }
        .data-row { margin: 10px 0; font-size: 14px; color: #aaaaaa; line-height: 1.5; padding: 6px 0; border-bottom: 1px solid #2a2a35; }
        .data-val { color: #ffffff; font-weight: bold; float: right; text-align: right; max-width: 60%; }
        .clear { clear: both; }
        .bar-bg { background: #3a3a4a; width: 100%; height: 12px; border-radius: 6px; margin-top: 8px; overflow: hidden; }
        .bar-fill { background: #00ffcc; height: 100%; width: 0%; transition: width 0.6s ease; }
        .nav-link { display: block; text-align: center; color: #ff3366; font-size: 16px; font-weight: bold; margin: 15px; text-decoration: none; border: 1px solid #ff3366; padding: 12px; border-radius: 6px; background: rgba(255,51,102,0.05); }
        .chart-container { position: relative; width: 100%; height: 180px; margin-top: 12px; background: #121216; border-radius: 6px; padding: 6px; box-sizing: border-box; border: 1px solid #3a3a4a; }
        .login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #121212; display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .login-box { background: #22222b; border: 1px solid #ff3366; padding: 30px; border-radius: 8px; width: 85%; max-width: 320px; text-align: center; }
        .login-box h3 { margin: 0 0 15px 0; font-size: 18px; color: #ffffff; }
        .login-box input { background: #16161a; border: 1px solid #ff3366; padding: 12px; width: 100%; box-sizing: border-box; color: #ffffff; font-size: 18px; text-align: center; border-radius: 4px; margin-bottom: 15px; outline: none; }
        .login-box button { background: #ff3366; border: none; color: #ffffff; padding: 12px; width: 100%; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        .loading-text { font-size: 14px; color: #00ffcc; margin: 10px 0; text-align: center; }
        .gist-status { font-size: 12px; color: #ffcc00; text-align: center; margin-top: 5px; font-weight: bold; }
    </style>

    <script>
        // 📡 原生標準 100% 同步 Google Sheet CSV 網址
        var csvMainUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTxdxSecRK-c5JnXNdMqt__8HjZI1mZFP8gP7YF2MSGDQRfj_fheZZnDRih-95CRCbnN3QG7XrJMthY/pub?gid=99162601&single=true&output=csv";
        
        // 🔒 鎖定教練自己的 GitHub 帳號名
        var GITHUB_USER = "siukit88";

        var _0x5a1b = ["1000", "Kit", "1001", "Nein", "1002", "Simon", "1003", "Alex", "1004", "Sun", "1005", "Jackson", "1006", "Joy", "1007", "George", "1008", "Lip", "1009", "Wing_PTL", "1010", "Jason_PTL", "1011", "Alwyn", "1012", "Camille", "1013", "Fion", "1014", "Daniel", "1015", "KingYan", "1016", "Szero", "1017", "Frances", "1018", "Bianca", "1019", "Mabel", "1020", "Avis", "1021", "Jason", "1022", "Jerry", "1023", "Rita", "1024", "Ruby", "1025", "Calvin Siu", "Thomas", "1026", "Thomas", "1027", "Yin Wai", "1028", "Gary", "1029", "Lois", "1030", "Gaby", "1031", "Carol", "1032", "Timothy", "1033", "Charlotte Lokman", "1034", "Kayan", "1208", "Coach"];
        var _0x3b2c = {}; for(var i=0; i<_0x5a1b.length; i+=2){ _0x3b2c[_0x5a1b[i]] = _0x5a1b[i+1]; }

        var authorizedName = ""; var isCoachMode = false; var allRecords = []; var cachedCsvText = ""; var bioChartInstance = null; var paceChartInstance = null;

        // 🔐 門禁身分驗證
        function verifyIdentity() {
            var inputPwd = document.getElementById('user-pwd').value.trim();
            var errField = document.getElementById('login-err'); var nameSelect = document.getElementById('filter-name');
            if (inputPwd === "") return;
            
            if (inputPwd === _0x5a1b[_0x5a1b.length-2]) {
                isCoachMode = true; authorizedName = "Coach";
                var optionsHtml = ''; for(var k in _0x3b2c){ if(k!=="1208") optionsHtml += '<option value="' + _0x3b2c[k] + '">👤 學員：' + _0x3b2c[k] + '</option>'; }
                nameSelect.innerHTML = optionsHtml; nameSelect.removeAttribute('disabled');
                document.getElementById('login-screen').style.display = 'none'; document.getElementById('app-content').style.display = 'block';
                startLoadingData(); return;
            }
            if (_0x3b2c[inputPwd]) {
                isCoachMode = false; authorizedName = _0x3b2c[inputPwd];
                nameSelect.innerHTML = '<option value="' + authorizedName + '">👤 學員：' + authorizedName + '</option>';
                nameSelect.setAttribute('disabled', 'true');
                document.getElementById('login-screen').style.display = 'none'; document.getElementById('app-content').style.display = 'block';
                startLoadingData();
            } else {
                errField.style.display = 'block'; errField.style.color = '#ff4d4d'; errField.innerText = "❌ 門禁安全驗證失敗";
                document.getElementById('user-pwd').value = "";
            }
        }

        // 🔄 異步下載 Google Excel 數據
        function startLoadingData() {
            var statusEl = document.getElementById('loading-status');
            if(statusEl) statusEl.style.display = 'block';
            
            fetch(csvMainUrl + "?t=" + new Date().getTime())
                .then(function(res) { 
                    if(!res.ok) { throw new Error('CSV Link Error'); }
                    return res.text(); 
                })
                .then(function(text) { cachedCsvText = text; parseAndFilterData(); })
                .catch(function(err) { 
                    if(document.getElementById('loading-status')) {
                        document.getElementById('loading-status').innerText = "❌ 雲端同步失敗。"; 
                    }
                });
        }

        function parseStandardCSV(csvText) {
            var lines = []; var currentLine = []; var currentCell = ''; var inQuotes = false;
            var normalized = csvText.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
            for (var i = 0; i < normalized.length; i++) {
                var c = normalized[i];
                if (c === '"') { inQuotes = !inQuotes; }
                else if (c === ',' && !inQuotes) { currentLine.push(currentCell.trim()); currentCell = ''; }
                else if (c === '\n' && !inQuotes) { currentLine.push(currentCell.trim()); lines.push(currentLine); currentLine = []; currentCell = ''; }
                else { currentCell += c; }
            }
            if (currentCell || currentLine.length > 0) { currentLine.push(currentCell.trim()); lines.push(currentLine); }
            return lines;
        }

        function parseAndFilterData() {
            try {
                var lines = parseStandardCSV(cachedCsvText);
                var weekSelect = document.getElementById('filter-week'); var nameSelect = document.getElementById('filter-name');
                var targetName = nameSelect.value ? nameSelect.value.trim() : authorizedName;
                var cleanTarget = targetName.replace(/\s+/g, "").toLowerCase();
                
                allRecords = []; var weeks = {};
                if(lines && lines.length > 1) {
                    var idxName = 1; var idxWeek = 2; var idxDist = 3; var idxTime = 4;
                    var idxCadence = 5; var idxStride = 6; var idxHr = 7; var idxRisk = 8;
                    var idxWeather = 9; var idxSupply = 10; var idxClimb = 11;

                    for(var i = 1; i < lines.length; i++) {
                        var row = lines[i];
                        if(row && row.length > idxName && row[idxName]) {
                            var cleanCellName = row[idxName].replace(/\s+/g, "").toLowerCase();
                            if(cleanCellName === cleanTarget || (cleanTarget === "nein" && cleanCellName === "nien") || (cleanTarget === "nien" && cleanCellName === "nein")) {
                                var wValue = row[idxWeek] ? row[idxWeek].toString().trim() : "1";
                                allRecords.push({ 
                                    timestamp: row[0]||"--", name: row[idxName].trim(), week: wValue, 
                                    distance: row[idxDist]||"0", time: row[idxTime]||"--", cadence: row[idxCadence]||"0", 
                                    stride: row[idxStride]||"0", hr: row[idxHr]||"0", risk: row[idxRisk]||"良好", 
                                weather: row[idxWeather]||"正常", supply: row[idxSupply]||"正常", climb: row[idxClimb]||"0",
                                    rawRowPackage: row 
                                });
                                weeks[wValue] = true;
                            }
                        }
                    }
                }

                weekSelect.innerHTML = '<option value="">選擇週數...</option>';
                var sortedWeeks = Object.keys(weeks).sort(function(a,b){return parseInt(a)-parseInt(b);});
                sortedWeeks.forEach(function(w) { 
                    weekSelect.innerHTML += '<option value="' + w + '">第 ' + w + ' 週</option>'; 
                });
                
                if(document.getElementById('loading-status')) document.getElementById('loading-status').style.display = 'none';
                if(allRecords && allRecords.length > 0) { 
                    var last = allRecords[allRecords.length - 1]; if(last) { weekSelect.value = last.week; updateDisplay(last.week); }
                } else { clearDisplayFields(); }
            } catch (error) { if(document.getElementById('loading-status')) document.getElementById('loading-status').innerText = "❌ 數據解析錯誤。"; }
        }

        function clearDisplayFields() {
            document.getElementById('val-date').innerText = "--"; document.getElementById('val-distance').innerText = "--"; 
            document.getElementById('val-time').innerText = "--"; document.getElementById('val-cadence').innerText = "--"; 
            document.getElementById('val-stride').innerText = "--"; document.getElementById('val-hr').innerText = "--";
            document.getElementById('val-risk').innerText = "--"; document.getElementById('val-weather').innerText = "--";
            document.getElementById('val-supply').innerText = "--"; document.getElementById('val-climb').innerText = "--";
            document.getElementById('val-eph').innerText = "--"; document.getElementById('val-feedback').innerText = "--";
        }

        // 🔄 【雙軌融合異步引擎 + 萬用模糊指紋配對】
        async function updateDisplay(selectedWeek) {
            if(!allRecords || allRecords.length === 0) return;
            var matched = allRecords.find(function(r) { return r.week === selectedWeek; });
            if (!matched) return;

            var nameSelect = document.getElementById('filter-name');
            var targetName = nameSelect.value ? nameSelect.value.trim() : authorizedName;

            // 軌道一：同步原生標準 Excel 常規數據
            document.getElementById('val-date').innerText = matched.timestamp.split(' ')[0] || matched.timestamp;
            document.getElementById('val-distance').innerText = matched.distance + " km"; 
            document.getElementById('val-time').innerText = matched.time; 
            document.getElementById('val-cadence').innerText = matched.cadence + " spm"; 
            document.getElementById('val-stride').innerText = matched.stride + " m";
            document.getElementById('val-hr').innerText = matched.hr + " bpm";
            document.getElementById('val-climb').innerText = matched.climb + " 米";
            document.getElementById('val-risk').innerText = matched.risk;
            document.getElementById('val-weather').innerText = matched.weather;
            document.getElementById('val-supply').innerText = matched.supply;
            document.getElementById('val-feedback').innerText = "⚡ 正在穿透 GitHub Gist 讀取無限時序流...";
            document.getElementById('gist-loading-status').innerText = "📡 正在調取 GitHub 遠端保險箱...";
            document.getElementById('gist-loading-status').style.color = "#ffcc00";

            var distNum = parseFloat(matched.distance) || 0; 
            var climbNum = parseFloat(matched.climb) || 0;
            var hrNum = parseInt(matched.hr) || 0;

            var pct = Math.min(100, Math.max(10, (hrNum / 200) * 100));
            document.getElementById('hr-bar').style.width = pct + "%";

            var hoursNum = 0;
            if (matched.time) {
                var match = matched.time.match(/([0-9]{1,2}):([0-9]{2}):([0-9]{2})/);
                if (match) { hoursNum = parseInt(match[1]) + (parseInt(match[2]) / 60) + (parseInt(match[3]) / 3600); }
            }
            if (hoursNum > 0) {
                document.getElementById('val-eph').innerText = ((distNum + (climbNum / 100)) / hoursNum).toFixed(2) + " EP/小時";
            } else { document.getElementById('val-eph').innerText = "--"; }

            var xLabels = ['0km', (distNum*0.2).toFixed(2)+'km', (distNum*0.4).toFixed(2)+'km', (distNum*0.6).toFixed(2)+'km', (distNum*0.8).toFixed(2)+'km', distNum + 'km'];
            
            var finalClimbData = [Math.round(climbNum*0.01), Math.round(climbNum*0.28), Math.round(climbNum*0.41), Math.round(climbNum*0.07), Math.round(climbNum*0.41), Math.round(climbNum*0.20)];
            var finalHrData = [hrNum - 15, hrNum + 8, hrNum + 18, hrNum - 22, hrNum + 12, hrNum - 7];
            var finalPowerData = [Math.round(hrNum*1.3), Math.round(hrNum*1.6), Math.round(hrNum*1.4), Math.round(hrNum*1.8), Math.round(hrNum*1.5), Math.round(hrNum*1.35)];

            // 軌道二：🚀 擊穿隱形空格，精準讀取 Gist 大數據包
            try {
                var listRes = await fetch("https://api.github.com/users/" + GITHUB_USER + "/gists?per_page=100&_=" + new Date().getTime());
                if(listRes.ok) {
                    var gists = await listRes.json();
                    var matchedRawUrl = null;
                    
                    // 🧬 萬用模糊比對演算法：全自動對位
                    var fingerTarget = (targetName + "_" + selectedWeek).replace(/[\s_第週]/g, "").toLowerCase();

                    for(var i=0; i<gists.length; i++) {
                        var filesObj = gists[i].files;
                        if(filesObj) {
                            for(var fn in filesObj) {
                                var fingerFile = fn.replace(/[\s_第週\.json]/g, "").toLowerCase();
                                if(fingerFile === fingerTarget) {
                                    matchedRawUrl = filesObj[fn].raw_url;
                                    break;
                                }
                            }
                        }
                        if(matchedRawUrl) break;
                    }

                    if(matchedRawUrl) {
                        var dataRes = await fetch(matchedRawUrl);
                        var bigData = await dataRes.json();

                        document.getElementById('val-feedback').innerText = bigData.feedback || "該週學員未填寫心得感想。";
                        document.getElementById('gist-loading-status').innerText = "🟢 FIT 時序大數據對位成功！";
                        document.getElementById('gist-loading-status').style.color = "#00ffcc";

                        if(bigData.climb_stream) finalClimbData = bigData.climb_stream.split('-').map(Number);
                        if(bigData.hr_stream) finalHrData = bigData.hr_stream.split('-').map(Number);
                        if(bigData.power_stream) finalPowerData = bigData.power_stream.split('-').map(Number);

                        xLabels = Array.from({length: finalHrData.length}, function(_, idx) {
                            return ((idx / (finalHrData.length - 1)) * distNum).toFixed(1) + "km";
                        });
                    } else {
                        document.getElementById('val-feedback').innerText = "⚠️ 該週無 FIT 大數據 (可於 Excel 欄位12後讀取歷史數據)。";
                        document.getElementById('gist-loading-status').innerText = "🟡 遠端未見 FIT 大數據。";
                        document.getElementById('gist-loading-status').style.color = "#ffb703";
                        
                        var rowPack = matched.rawRowPackage;
                        if (rowPack && rowPack.length > 12) {
                            var streams = [];
                            for (var colIdx = 12; colIdx < rowPack.length; colIdx++) {
                                if (rowPack[colIdx] && (rowPack[colIdx].indexOf(',') !== -1 || rowPack[colIdx].indexOf('[') !== -1)) {
                                    streams.push(rowPack[colIdx].toString().trim().replace(/[\[\]"]/g, ""));
                                }
                            }
                            if (streams[0] && streams[0].trim() !== "") { finalClimbData = streams[0].split(',').map(Number); }
                            if (streams[1] && streams[1].trim() !== "") { finalHrData = streams[1].split(',').map(Number); }
                            if (streams[2] && streams[2].trim() !== "") { finalPowerData = streams[2].split(',').map(Number); }
                        }
                    }
                }
            } catch(gistErr) {
                console.error(gistErr);
                document.getElementById('gist-loading-status').innerText = "❌ 遠端保險箱連線超時。";
                document.getElementById('gist-loading-status').style.color = "#ff4d4d";
            }

            // 🎨 渲染原版 Chart.js 圖表
            try {
                if (bioChartInstance) bioChartInstance.destroy();
                bioChartInstance = new Chart(document.getElementById('bioMetricsChart').getContext('2d'), {
                    type: 'line',
                    data: {
                        labels: xLabels,
                        datasets: [
                            { label: '實時心率 (bpm)', data: finalHrData, borderColor: '#ff3366', fill: false, tension: 0.2, yAxisID: 'y', pointRadius: finalHrData.length > 20 ? 0 : 3, borderWidth: 2 },
                            { label: '輸出功率 (W)', data: finalPowerData, borderColor: '#3a86ff', fill: false, tension: 0.2, yAxisID: 'y2', pointRadius: finalPowerData.length > 20 ? 0 : 3, borderWidth: 2 },
                            { label: '[背景] 實際爬升高度', data: finalClimbData, borderColor: 'rgba(255,255,255,0.08)', borderWidth: 1, backgroundColor: 'rgba(255,255,255,0.04)', fill: true, pointRadius: 0, tension: 0.4, yAxisID: 'y1' }
                        ]
                    },
                    options: { 
                        responsive: true, 
                        maintainAspectRatio: false, 
                        scales: { 
                            y: { type: 'linear', display: true, position: 'left', ticks: { color: '#ff3366' }, grid: { color: '#222' } }, 
                            y2: { type: 'linear', display: true, position: 'right', ticks: { color: '#
