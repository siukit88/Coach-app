<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kit Coach 團隊特訓大數據看板 v44.0</title>
    <style>
        body { margin: 0; padding: 0; background-color: #121212; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #ffffff; }
        .phone-container { width: 100%; max-width: 412px; min-height: 100vh; background: #16161a; margin: 0 auto; padding-bottom: 40px; box-sizing: border-box; }
        
        /* 🎯 頂部專屬粉紅色 Banner */
        .header { background: #ff3366; padding: 20px; text-align: left; }
        .header h1 { margin: 0; font-size: 22px; font-weight: bold; letter-spacing: 0.5px; }
        .header p { margin: 5px 0 0 0; font-size: 13px; color: rgba(255,255,255,0.9); }
        
        .content-container { padding: 20px; }
        .section-title { font-size: 16px; font-weight: bold; margin: 25px 0 15px 0; display: flex; align-items: center; }
        .section-title::before { content: ""; display: inline-block; width: 4px; height: 16px; background: #ff3366; margin-right: 8px; border-radius: 2px; }
        
        /* 📝 下拉選單樣式 */
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; font-size: 14px; color: #aaa; margin-bottom: 8px; }
        .select-ctrl { width: 100%; background: #1e1e24; border: 1px solid #333; border-radius: 6px; padding: 12px; color: #fff; font-size: 15px; box-sizing: border-box; outline: none; transition: border-color 0.2s; }
        .select-ctrl:focus { border-color: #ff3366; }
        
        /* 📢 教練評語專屬美化區塊 */
        .comment-box { background: rgba(0, 242, 254, 0.08); border: 1px solid #00f2fe; border-radius: 8px; padding: 15px; margin-top: 15px; min-height: 60px; }
        .comment-title { color: #00f2fe; font-weight: bold; font-size: 14px; margin-bottom: 6px; display: flex; align-items: center; }
        .comment-text { font-size: 15px; line-height: 1.5; color: #ffffff; white-space: pre-wrap; }
        .comment-loading { color: #888; font-style: italic; font-size: 14px; }

        /* 🚀 功能導航按鈕 */
        .btn-zone { margin-top: 30px; text-align: center; }
        .action-btn { display: block; width: 100%; background: #ff3366; color: #fff; font-size: 16px; font-weight: bold; text-decoration: none; text-align: center; padding: 14px; border-radius: 6px; box-sizing: border-box; transition: opacity 0.2s; }
        .action-btn:active { opacity: 0.8; }
    </style>
</head>
<body>

<div class="phone-container">
    <div class="header">
        <h1>Kit Coach 團隊特訓大數據</h1>
        <p>慢慢跑團 遠程智慧特訓看板 v44.0</p>
    </div>

    <div class="content-container">
        
        <div class="section-title">👤 請選擇跑手與特訓週數</div>
        
        <div class="input-group">
            <label>跑手姓名</label>
            <select class="select-ctrl" id="runnerSelect">
                <option value="">正在載入跑手名單...</option>
            </select>
        </div>

        <div class="input-group">
            <label>特訓週數</label>
            <select class="select-ctrl" id="weekSelect">
                <option value="">正在載入週數...</option>
            </select>
        </div>

        <div class="section-title">📢 智慧教練動態評語</div>
        <div class="comment-box" id="commentBox">
            <div class="comment-loading">請先選擇跑手與週數以載入評語...</div>
        </div>

        <div class="btn-zone">
            <a href="submit.html" class="action-btn">➔ 前往學員功課手動回報回報頁</a>
        </div>

    </div>
</div>

<script>
    // 💡 核心設定：請務必完成以下 Google 試算表發布步驟，並將網址貼在下面：
    // 1. 打開你的 Google 試算表後台 -> 檔案 -> 共用 -> 發布到網路
    // 2. 選擇「表單回應 1」（或者你儲存資料的那一頁），格式選擇「主要逗號分隔值 (.csv)」
    // 3. 點擊發布，並複製產生的網址，取代下面引號入面嘅文字：
    const GOOGLE_SHEET_CSV_URL = "把你發布的CSV網址貼喺度";

    // 1. 初始化跑手名單（100% 精準對齊你 Excel 的 35 人名字）
    const runners = [
        "Kit", "Nein", "Simon", "Alex", "Sun", "Jackson", "Joy", "George", "Lip", 
        "Wing_PTL", "Jason_PTL", "Alwyn", "Camille", "Fion", "Daniel", "KingYan", 
        "Szero", "Frances", "Bianca", "Mabel", "Avis", "Jason", "Jerry", "Rita", 
        "Ruby", "Calvin Siu", "Thomas", "Yin Wai", "Gary", "Lois", "Gaby", "Carol", 
        "Timothy", "Charlotte Lokman", "Kayan"
    ];

    window.addEventListener('DOMContentLoaded', () => {
        // 渲染跑手下拉選單
        const runnerSelect = document.getElementById('runnerSelect');
        runnerSelect.innerHTML = '<option value="">-- 請選擇跑手 --</option>';
        runners.forEach(name => {
            let opt = document.createElement('option');
            opt.value = name;
            opt.textContent = name;
            runnerSelect.appendChild(opt);
        });

        // 🎯 渲染週數下拉選單（對齊無空格格式「第1週」到「第40週」）
        const weekSelect = document.getElementById('weekSelect');
        weekSelect.innerHTML = '<option value="">-- 請選擇週數 --</option>';
        for(let i = 1; i <= 40; i++) {
            let opt = document.createElement('option');
            opt.value = `第${i}週`;
            opt.textContent = `第${i}週`;
            weekSelect.appendChild(opt);
        }

        // 綁定監聽事件，當跑手或週數改變時，自動去撈取評語
        runnerSelect.addEventListener('change', updateCommentTrigger);
        weekSelect.addEventListener('change', updateCommentTrigger);
    });

    // 觸發檢查與撈取
    function updateCommentTrigger() {
        const runner = document.getElementById('runnerSelect').value;
        const week = document.getElementById('weekSelect').value;
        const box = document.getElementById('commentBox');

        if (!runner || !week) {
            box.innerHTML = '<div class="comment-loading">請同時選擇跑手與特訓週數以查閱評語。</div>';
            return;
        }

        box.innerHTML = '<div class="comment-loading">⏳ 正在連線至大數據試算表撈取最新評語...</div>';
        loadCoachCommentFromExcel(runner, week);
    }

    // 🚀 從發布的 Google Sheet CSV 讀取並解析評語
    function loadCoachCommentFromExcel(targetRunner, targetWeek) {
        if (GOOGLE_SHEET_CSV_URL.includes("把你發布的CSV網址貼喺度")) {
            document.getElementById('commentBox').innerHTML = `
                <div class="comment-title">⚠️ 系統提示</div>
                <div class="comment-text" style="color: #ff3366;">尚未設定試算表連動網址。請在 index.html 內修改 GOOGLE_SHEET_CSV_URL 網址。</div>
            `;
            return;
        }

        fetch(GOOGLE_SHEET_CSV_URL + "?t=" + new Date().getTime()) // 加上時間戳防止瀏覽器快取舊資料
        .then(response => {
            if (!response.ok) throw new Error('網絡連線異常');
            return response.text();
        })
        .then(csvText => {
            // 解析 CSV 每一行
            let lines = csvText.split("\n").map(line => {
                // 簡單處理 CSV 逗號分割（考慮雙引號內有逗號的標準格式）
                return line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
            });

            if (lines.length < 2) {
                document.getElementById('commentBox').innerHTML = '<div class="comment-text">暫時無任何數據上載紀錄。</div>';
                return;
            }

            // 🎯 欄位定位：自動去比對第一行的 Header 名字
            let headers = lines[0].map(h => h.replace(/"/g, '').trim());
            
            // 根據你 Google 表單的欄位名稱自動尋找索引（防止你改過欄位順序）
            let runnerIdx = headers.findIndex(h => h.includes("姓名") || h.toLowerCase().includes("runner"));
            let weekIdx = headers.findIndex(h => h.includes("週數") || h.toLowerCase().includes("week"));
            
            // 💡 假設你在 Google 表單對應的 Excel 最後手動加了一欄叫「教練評語」
            // 如果你沒加，預設會抓整行 Excel 的最後一欄（通常是最後一列）
            let commentIdx = headers.findIndex(h => h.includes("評語") || h.includes("教練"));
            if (commentIdx === -1) {
                commentIdx = lines[0].length - 1; // 如果找不到叫「評語」的欄位，就預設抓最後一欄
            }

            // 防呆修正
            if (runnerIdx === -1) runnerIdx = 1; // 預設第二欄
            if (weekIdx === -1) weekIdx = 2;   // 預設第三欄

            let matchedComment = "";

            // 🔄 從後往前搜尋（最新上載的排在後面）
            for (let i = lines.length - 1; i >= 1; i--) {
                let row = lines[i];
                if (!row || row.length <= Math.max(runnerIdx, weekIdx)) continue;

                let rowRunner = row[runnerIdx]?.replace(/"/g, '').trim();
                let rowWeek = row[weekIdx]?.replace(/"/g, '').trim();

                // 當名字和週數完全吻合時
                if (rowRunner === targetRunner && rowWeek === targetWeek) {
                    let rawComment = row[commentIdx];
                    if (rawComment && rawComment.replace(/"/g, '').trim() !== "") {
                        matchedComment = rawComment.replace(/"/g, '').trim();
                        break; // 搵到最新的一條就跳出循環
                    }
                }
            }

            // 渲染到前端畫面上
            const box = document.getElementById('commentBox');
            if (matchedComment !== "") {
                box.innerHTML = `
                    <div class="comment-title">💡 Kit Coach 對 ${targetRunner} (${targetWeek}) 的指導：</div>
                    <div class="comment-text">${matchedComment}</div>
                `;
            } else {
                box.innerHTML = `
                    <div class="comment-title">📋 狀態提示</div>
                    <div class="comment-text" style="color: #888;">教練尚未針對 ${targetRunner} 在 ${targetWeek} 輸入評語，或該週功課尚未上載。</div>
                `;
            }
        })
        .catch(err => {
            console.error(err);
            document.getElementById('commentBox').innerHTML = '<div class="comment-text" style="color: #ff3366;">❌ 讀取大數據失敗，請確保試算表已成功「發布到網路」並選擇 CSV 格式。</div>';
        });
    }
</script>

</body>
</html>
