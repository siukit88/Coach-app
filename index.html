<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kit Coach 團隊特訓智慧看板 v36.0</title>
    <style>
        body { margin: 0; padding: 0; background-color: #121212; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #ffffff; }
        .phone-container { width: 100%; max-width: 412px; min-height: 100vh; background: #16161a; margin: 0 auto; padding-bottom: 40px; box-sizing: border-box; }
        
        .header { background: #ff3366; padding: 20px; text-align: left; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { margin: 0; font-size: 22px; font-weight: bold; letter-spacing: 0.5px; }
        .header p { margin: 5px 0 0 0; font-size: 13px; color: rgba(255,255,255,0.9); }
        .btn-entry { background: #ffffff; color: #ff3366; border: none; padding: 8px 14px; border-radius: 20px; font-size: 13px; font-weight: bold; text-decoration: none; cursor: pointer; }
        
        .dashboard-container { padding: 20px; }
        
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; font-size: 14px; color: #aaa; margin-bottom: 8px; }
        .select-ctrl { width: 100%; background: #1e1e24; border: 1px solid #333; border-radius: 6px; padding: 12px; color: #fff; font-size: 15px; box-sizing: border-box; outline: none; }
        .grid-2 { display: flex; gap: 12px; }
        .grid-2 .select-ctrl { flex: 1; }

        .data-card { background: #1e1e24; border-radius: 12px; padding: 20px; border: 1px solid #2d2d35; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .card-header { font-size: 14px; color: #888888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; display: flex; justify-content: space-between; }
        
        .main-stat { font-size: 48px; font-weight: 900; color: #00f2fe; line-height: 1; margin-bottom: 5px; }
        .main-stat-unit { font-size: 16px; color: #888888; font-weight: normal; margin-left: 5px; }
        
        .grid-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 15px; }
        .stat-box { background: rgba(255,255,255,0.02); border-radius: 8px; padding: 12px; border: 1px solid rgba(255,255,255,0.05); }
        .stat-label { font-size: 12px; color: #aaa; margin-bottom: 4px; }
        .stat-value { font-size: 18px; font-weight: bold; color: #ffffff; }
        
        .badge-zone { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 15px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.08); }
        .info-badge { font-size: 11px; font-weight: bold; padding: 4px 10px; border-radius: 12px; background: rgba(255,255,255,0.05); border: 1px solid #444; color: #ccc; }
        .info-badge.danger { background: rgba(255, 51, 102, 0.1); border-color: #ff3366; color: #ff3366; }
        .info-badge.warning { background: rgba(255, 193, 7, 0.1); border-color: #ffc107; color: #ffc107; }
        .info-badge.success { background: rgba(0, 242, 254, 0.1); border-color: #00f2fe; color: #00f2fe; }

        .status-msg { text-align: center; color: #888888; padding: 20px; font-size: 14px; }
    </style>
</head>
<body>

<div class="phone-container">
    <div class="header">
        <div>
            <h1>智慧特訓數據看板</h1>
            <p>慢慢跑團 遠程核心指標 platform v36.0</p>
        </div>
        <a href="submit.html" class="btn-entry">填報功課 ➔</a>
    </div>

    <div class="dashboard-container">
        <div class="input-group">
            <label>篩選歷史數據觀看 (自動載入已有資料)</label>
            <div class="grid-2">
                <select class="select-ctrl" id="runnerFilter">
                    <option value="">正在載入跑手...</option>
                </select>
                <select class="select-ctrl" id="weekFilter">
                    <option value="">正在載入週數...</option>
                </select>
            </div>
        </div>

        <div id="statusMessage" class="status-msg">正在連線至大數據試算表中心...</div>

        <div id="dashboardContent" style="display: none;">
            <div class="data-card">
                <div class="card-header">
                    <span>🏃‍♂️ 當週特訓長距離指標</span>
                    <span id="displayWeek" style="color: #ff3366; font-weight: bold;">-</span>
                </div>
                <div class="main-stat" id="statDistance">0.00<span class="main-stat-unit">km</span></div>
                
                <div class="grid-stats">
                    <div class="stat-box">
                        <div class="stat-label">⛰️ 爬升海拔</div>
                        <div class="stat-value" id="statElevation">0 米</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">⏱️ 長跑時間</div>
                        <div class="stat-value" id="statDuration">00:00:00</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">⚡ 平均步頻</div>
                        <div class="stat-value" id="statCadence">0 spm</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">📏 平均步距</div>
                        <div class="stat-value" id="statStride">0.00 米</div>
                    </div>
                </div>

                <div class="stat-box" style="margin-top: 15px; width: 100%;">
                    <div class="stat-label">❤️ 平均心率</div>
                    <div class="stat-value" id="statHR" style="color: #ff3366;">0 bpm</div>
                </div>

                <div class="badge-zone" id="statBadges"></div>
            </div>
        </div>
    </div>
</div>

<script>
    const SPREADSHEET_JSON_URL = "https://docs.google.com/spreadsheets/d/1JYWkUsbs9rmfZdwxBuWZSOJGHXFknmM35gR6usdoY/gviz/tq?tqx=out:json&sheet=表單回應5";
    let allRecords = [];

    window.addEventListener('DOMContentLoaded', () => {
        initFilters();
        fetchDashboardData();
    });

    function initFilters() {
        const runners = [
            "Kit", "Nein", "Simon", "Alex", "Sun", "Jackson", "Joy", "George", "Lip", 
            "Wing_PTL", "Jason_PTL", "Alwyn", "Camille", "Fion", "Daniel", "KingYan", 
            "Szero", "Frances", "Bianca", "Mabel", "Avis", "Jason", "Jerry", "Rita", 
            "Ruby", "Calvin Siu", "Thomas", "Yin Wai", "Gary", "Lois", "Gaby", "Carol", 
            "Timothy", "Charlotte Lokman", "Kayan"
        ];
        
        const runnerFilter = document.getElementById('runnerFilter');
        runnerFilter.innerHTML = '<option value="">選擇跑手...</option>';
        runners.forEach(name => {
            let opt = document.createElement('option');
            opt.value = name; opt.textContent = name;
            runnerFilter.appendChild(opt);
        });

        const weekFilter = document.getElementById('weekFilter');
        weekFilter.innerHTML = '<option value="">選擇週數...</option>';
        for(let i = 1; i <= 40; i++) {
            let val = "第 " + i + " 週";
            let opt = document.createElement('option');
            opt.value = val; opt.textContent = val;
            weekFilter.appendChild(opt);
        }

        runnerFilter.addEventListener('change', updateDashboardUI);
        weekFilter.addEventListener('change', updateDashboardUI);
    }

    function fetchDashboardData() {
        fetch(SPREADSHEET_JSON_URL)
        .then(res => res.text())
        .then(txt => {
            const rawJson = JSON.parse(txt.substring(txt.indexOf("{"), txt.lastIndexOf("}") + 1));
            const rows = rawJson.table.rows;
            
            allRecords = rows.map(r => {
                const row = r.c.map(cell => cell ? (cell.v !== null ? cell.v : "") : "");
                return {
                    name: String(row[1]).trim(),      // B 欄：學員姓名
                    week: String(row[2]).trim(),      // C 欄：特訓週數
                    distance: row[3] || "0",          // D 欄：長跑距離
                    duration: row[4] || "--:--:--",   // E 欄：長跑時間
                    cadence: row[5] || "0",           // F 欄：平均步頻
                    stride: row[6] || "0.00",         // G 欄：平均步距
                    hr: row[7] || "0",                // H 欄：平均心率
                    risk: String(row[8] || "良好"),    // I 欄：身體風險
                    weather: String(row[9] || "舒適常溫"), // J 欄：環境天氣
                    supply: String(row[10] || "補給正常"), // K 欄：補給問題
                    elevation: row[11] || "0"         // L 欄：爬升海拔 (對齊第 11 索引)
                };
            });
            document.getElementById('statusMessage').innerText = "💡 數據加載完成，請選擇跑手與特訓週數解讀指標。";
        })
        .catch(err => {
            console.error(err);
            document.getElementById('statusMessage').innerText = "❌ 無法讀取試算表雲端數據。";
        });
    }

    function updateDashboardUI() {
        const selectedRunner = document.getElementById('runnerFilter').value;
        const selectedWeek = document.getElementById('weekFilter').value;

        if (!selectedRunner || !selectedWeek) {
            document.getElementById('dashboardContent').style.display = "none";
            return;
        }

        const match = allRecords.find(r => r.name === selectedRunner && r.week === selectedWeek);
        const msgBox = document.getElementById('statusMessage');

        if (match) {
            msgBox.style.display = "none";
            document.getElementById('dashboardContent').style.display = "block";
            
            document.getElementById('displayWeek').innerText = match.week;
            document.getElementById('statDistance').innerHTML = `${match.distance}<span class="main-stat-unit">km</span>`;
            document.getElementById('statElevation').innerText = `${match.elevation} 米`;
            document.getElementById('statDuration').innerText = match.duration;
            document.getElementById('statCadence').innerText = `${match.cadence} spm`;
            document.getElementById('statStride').innerText = `${match.stride} 米`;
            document.getElementById('statHR').innerText = `${match.hr} bpm`;

            const badgeZone = document.getElementById('statBadges');
            badgeZone.innerHTML = "";

            let riskClass = match.risk.includes("良好") ? "success" : "danger";
            badgeZone.innerHTML += `<span class="info-badge ${riskClass}">風險: ${match.risk}</span>`;

            let weatherClass = match.weather.includes("舒適") ? "success" : "warning";
            badgeZone.innerHTML += `<span class="info-badge ${weatherClass}">天氣: ${match.weather}</span>`;

            let supplyClass = match.supply.includes("正常") ? "success" : "warning";
            badgeZone.innerHTML += `<span class="info-badge ${supplyClass}">補給: ${match.supply}</span>`;

        } else {
            document.getElementById('dashboardContent').style.display = "none";
            msgBox.style.display = "block";
            msgBox.innerText = `📭 跑手 ${selectedRunner} 在 ${selectedWeek} 尚未提交特訓功課。`;
        }
    }
</script>
</body>
</html>
