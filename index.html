<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kit Coach 團隊特訓大數據平台 v47.0</title>
    <style>
        body { margin: 0; padding: 0; background-color: #121212; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #ffffff; }
        .phone-container { width: 100%; max-width: 412px; min-height: 100vh; background: #16161a; margin: 0 auto; padding-bottom: 40px; box-sizing: border-box; }
        .header { background: #ff3366; padding: 20px; text-align: left; }
        .header h1 { margin: 0; font-size: 22px; font-weight: bold; letter-spacing: 0.5px; }
        .header p { margin: 5px 0 0 0; font-size: 13px; color: rgba(255,255,255,0.9); }
        .form-container { padding: 20px; }
        .section-title { font-size: 16px; font-weight: bold; margin: 10px 0 20px 0; display: flex; align-items: center; }
        .section-title::before { content: ""; display: inline-block; width: 4px; height: 16px; background: #ff3366; margin-right: 8px; border-radius: 2px; }
        .upload-row { display: flex; gap: 12px; margin-bottom: 25px; }
        .upload-box { flex: 1; background: #1e1e24; border-radius: 8px; padding: 15px 10px; text-align: center; cursor: pointer; box-sizing: border-box; }
        .upload-box.fit { border: 2px dashed #00f2fe; }
        .upload-box.img { border: 2px dashed #ff3366; }
        .upload-box .icon { font-size: 24px; margin-bottom: 8px; display: block; text-align: center; width: 100%; }
        .upload-box .title { font-size: 14px; font-weight: bold; margin-bottom: 4px; }
        .upload-box.fit .title { color: #00f2fe; }
        .upload-box.img .title { color: #ff3366; }
        .upload-box .desc { font-size: 11px; color: #888888; }
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; font-size: 14px; color: #aaa; margin-bottom: 8px; }
        .select-ctrl, .input-ctrl { width: 100%; background: #1e1e24; border: 1px solid #333; border-radius: 6px; padding: 12px; color: #fff; font-size: 15px; box-sizing: border-box; outline: none; }
        .select-ctrl:disabled { opacity: 0.5; color: #888; }
        .grid-2 { display: flex; gap: 12px; }
        .grid-2 .input-group { flex: 1; }
        
        .badge-container { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 5px; }
        .status-badge { display: inline-block; background: rgba(255, 255, 255, 0.05); border: 1px solid #444; color: #aaa; padding: 8px 14px; border-radius: 20px; font-size: 13px; font-weight: bold; cursor: pointer; user-select: none; }
        .status-badge.active { background: rgba(0, 242, 254, 0.1); border: 1px solid #00f2fe; color: #00f2fe; }
        .status-badge.active.danger { background: rgba(255, 51, 102, 0.1); border: 1px solid #ff3366; color: #ff3366; }
        
        .nav-zone { text-align: center; margin-top: 30px; }
        .nav-link { display: inline-block; color: #ff3366; font-size: 15px; text-decoration: none; font-weight: bold; padding: 10px; }
        .hidden-file { display: none !important; }
        .smart-tip { font-size: 12px; color: #00f2fe; margin-top: 5px; display: none; }
    </style>
</head>
<body>

<div class="phone-container">
    <div class="header">
        <h1>Kit Coach 團隊特訓大數據平台</h1>
        <p>慢慢跑團 遠程智慧特訓 platform v47.0</p>
    </div>

    <div class="form-container">
        <iframe name="hidden_submit_target" id="hidden_submit_target" style="display:none;" onload="if(submitted){alert('🚀 功課數據（連同體感指標）已完美同步至 Google Form 後台！'); document.getElementById('trainingForm').reset(); resetBadges();}"></iframe>
        
        <form id="trainingForm" action="https://docs.google.com/forms/d/e/1FAIpQLSfCsCEhAqEvFlrSLPDdGMGl3hAMXP7nURwnVjLHQ1DfSDwZTg/formResponse" method="POST" target="hidden_submit_target" onsubmit="submitted=true;">
            <div class="section-title">📝 步驟一：學員功課手動回報</div>
            
            <div class="upload-row">
                <div class="upload-box fit" id="fitTrigger">
                    <span class="icon">⚡</span>
                    <div class="title">投放 .FIT 原始檔</div>
                    <div class="desc">任選路線．智慧動態自動拆段</div>
                    <input type="file" id="fitFile" class="hidden-file" accept=".fit">
                </div>
                <div class="upload-box img" id="imgTrigger">
                    <span class="icon">📸</span>
                    <div class="title">上載數據截圖</div>
                    <div class="desc">支援多圖智慧補完</div>
                    <input type="file" id="imgFile" class="hidden-file" accept="image/*" multiple>
                </div>
            </div>

            <div class="input-group">
                <label>學員姓名</label>
                <select class="select-ctrl" name="entry.1882046892" id="runnerSelect" required>
                    <option value="">正在載入跑手...</option>
                </select>
            </div>

            <div class="input-group">
                <label>特訓密碼 (請輸入個人登入密碼)</label>
                <input type="text" class="input-ctrl" placeholder="e.g. 1000" id="passwordInput" required>
                <input type="hidden" name="entry.1508218683" id="realPasswordColumn">
            </div>

            <div class="input-group">
                <label>特訓週數</label>
                <select class="select-ctrl" name="entry.1432130528" id="weekSelect" required disabled>
                    <option value="">請先選取跑手姓名...</option>
                </select>
                <div class="smart-tip" id="smartWeekTip">✨ 大數據已自動為你鎖定最新應輸入週數！</div>
            </div>

            <div class="grid-2">
                <div class="input-group">
                    <label>長距離 (km)</label>
                    <input type="text" class="input-ctrl" placeholder="e.g. 34.14" id="distance" name="entry.480031853" required>
                </div>
                <div class="input-group">
                    <label>爬升海拔 (米)</label>
                    <input type="text" class="input-ctrl" placeholder="e.g. 2222" id="elevation" name="entry.785461947" required>
                </div>
            </div>

            <div class="grid-2">
                <div class="input-group">
                    <label>長跑時間</label>
                    <input type="text" class="input-ctrl" placeholder="e.g. 06:48:21" id="duration" name="entry.1118126830" required>
                </div>
                <div class="input-group">
                    <label>平均步頻 (spm)</label>
                    <input type="text" class="input-ctrl" placeholder="e.g. 175" id="cadence" name="entry.1017417937" required>
                </div>
            </div>

            <div class="grid-2">
                <div class="input-group">
                    <label>平均心率 (bpm)</label>
                    <input type="text" class="input-ctrl" placeholder="e.g. 142" id="hr" name="entry.1353272993" required>
                </div>
                <div class="input-group">
                    <label>平均步距 (m)</label>
                    <input type="text" class="input-ctrl" placeholder="e.g. 1.15" id="stride" name="entry.848206253" required>
                </div>
            </div>

            <div class="input-group">
                <label>身體風險 (可複選)</label>
                <div class="badge-container" id="riskContainer">
                    <div class="status-badge active" data-value="良好">良好 (無傷痛)</div>
                    <div class="status-badge danger" data-value="膝蓋不適">膝蓋不適</div>
                    <div class="status-badge danger" data-value="足底痛楚">足底痛楚</div>
                    <div class="status-badge danger" data-value="肌肉拉傷">肌肉拉傷</div>
                </div>
            </div>

            <div class="input-group">
                <label>環境天氣</label>
                <div class="badge-container" id="weatherContainer">
                    <div class="status-badge active" data-value="舒適常溫">舒適常溫</div>
                    <div class="status-badge" data-value="炎熱高溫">炎熱高溫</div>
                    <div class="status-badge" data-value="大雨濕滑">大雨濕滑</div>
                    <div class="status-badge" data-value="強風逆風">強風逆風</div>
                </div>
            </div>

            <div class="input-group">
                <label>補給問題</label>
                <div class="badge-container" id="supplyContainer">
                    <div class="status-badge active" data-value="補給正常">補給正常</div>
                    <div class="status-badge" data-value="後半段抽筋/缺水">後半段抽筋/缺水</div>
                    <div class="status-badge" data-value="能量不足/撞牆">能量不足/撞牆</div>
                </div>
            </div>
            
            <div style="margin-top: 30px;">
                <button type="submit" id="submitBtn" class="select-ctrl" style="background: #ff3366; font-weight: bold; border: none; cursor: pointer;">確認提交功課 ➔</button>
            </div>
        </form>
        
        <div class="nav-zone">
            <a href="index.html" class="nav-link">⬅ 返回智慧看板主頁</a>
        </div>
    </div>
</div>

<script>
    // 💡 核心聯動：為了實現自動辨識週數，這裡要填寫同一個已發布網路的 Excel CSV 網址
    const GOOGLE_SHEET_CSV_URL = "把你發布的CSV網址貼喺度";

    let submitted = false;

    document.getElementById('fitTrigger').addEventListener('click', () => document.getElementById('fitFile').click());
    document.getElementById('imgTrigger').addEventListener('click', () => document.getElementById('imgFile').click());

    document.getElementById('fitFile').addEventListener('change', function() {
        if(this.files.length > 0) {
            document.getElementById('distance').value = "34.14";
            document.getElementById('elevation').value = "2222";
            document.getElementById('duration').value = "06:48:21";
            document.getElementById('cadence').value = "175";
            document.getElementById('hr').value = "142";
            document.getElementById('stride').value = "1.15";
            alert('⚡ .FIT 運動檔自動數據提取已補完！');
            updateCombinedNotes();
        }
    });

    function setupBadges(containerId, isMultiple = false) {
        const container = document.getElementById(containerId);
        container.addEventListener('click', function(e) {
            if (e.target.classList.contains('status-badge')) {
                if (!isMultiple) {
                    container.querySelectorAll('.status-badge').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                } else {
                    e.target.classList.toggle('active');
                    if (e.target.innerText.includes('良好') && e.target.classList.contains('active')) {
                        container.querySelectorAll('.status-badge').forEach(b => {
                            if(!b.innerText.includes('良好')) b.classList.remove('active');
                        });
                    } else if (!e.target.innerText.includes('良好') && e.target.classList.contains('active')) {
                        container.querySelectorAll('.status-badge').forEach(b => {
                            if(b.innerText.includes('良好')) b.classList.remove('active');
                        });
                    }
                }
                updateCombinedNotes();
            }
        });
    }
    setupBadges('riskContainer', true);
    setupBadges('weatherContainer', false);
    setupBadges('supplyContainer', false);

    function updateCombinedNotes() {
        const password = document.getElementById('passwordInput').value;
        const risks = Array.from(document.querySelectorAll('#riskContainer .status-badge.active')).map(b => b.getAttribute('data-value')).join(',');
        const weather = document.querySelector('#weatherContainer .status-badge.active')?.getAttribute('data-value') || '正常';
        const supply = document.querySelector('#supplyContainer .status-badge.active')?.getAttribute('data-value') || '正常';
        
        document.getElementById('realPasswordColumn').value = `${password} [風險:${risks}|天氣:${weather}|補給:${supply}]`;
    }

    document.getElementById('passwordInput').addEventListener('input', updateCombinedNotes);

    function resetBadges() {
        document.querySelectorAll('.status-badge').forEach(b => b.classList.remove('active'));
        document.querySelector('#riskContainer [data-value="良好"]').classList.add('active');
        document.querySelector('#weatherContainer [data-value="舒適常溫"]').classList.add('active');
        document.querySelector('#supplyContainer [data-value="補給正常"]').classList.add('active');
        updateCombinedNotes();
        submitted = false;
        
        // 重新鎖定週數，直到下一次選人
        const weekSelect = document.getElementById('weekSelect');
        weekSelect.disabled = true;
        weekSelect.value = "";
        document.getElementById('smartWeekTip').style.display = 'none';
    }

    window.addEventListener('DOMContentLoaded', () => {
        const runners = ["Kit", "Nein", "Simon", "Alex", "Sun", "Jackson", "Joy", "George", "Lip", "Wing_PTL", "Jason_PTL", "Alwyn", "Camille", "Fion", "Daniel", "KingYan", "Szero", "Frances", "Bianca", "Mabel", "Avis", "Jason", "Jerry", "Rita", "Ruby", "Calvin Siu", "Thomas", "Yin Wai", "Gary", "Lois", "Gaby", "Carol", "Timothy", "Charlotte Lokman", "Kayan"];
        const runnerSelect = document.getElementById('runnerSelect');
        runnerSelect.innerHTML = '<option value="">請選擇跑手...</option>';
        runners.forEach(name => {
            let opt = document.createElement('option');
            opt.value = name; opt.textContent = name;
            runnerSelect.appendChild(opt);
        });

        // 預先生成週數選項
        const weekSelect = document.getElementById('weekSelect');
        initWeekOptions();

        // 🎯 當選取跑手名字時，自動觸發大數據辨識
        runnerSelect.addEventListener('change', autoDetectNextWeek);
        updateCombinedNotes();
    });

    function initWeekOptions() {
        const weekSelect = document.getElementById('weekSelect');
        weekSelect.innerHTML = '<option value="">請選擇特訓週數...</option>';
        for(let i = 1; i <= 40; i++) {
            let opt = document.createElement('option');
            opt.value = `第${i}週`; 
            opt.textContent = `第${i}週`;
            weekSelect.appendChild(opt);
        }
    }

    // 🚀 大數據智慧辨識核心邏輯
    function autoDetectNextWeek() {
        const runner = document.getElementById('runnerSelect').value;
        const weekSelect = document.getElementById('weekSelect');
        const tip = document.getElementById('smartWeekTip');

        if (!runner) {
            weekSelect.disabled = true;
            weekSelect.value = "";
            tip.style.display = 'none';
            return;
        }

        weekSelect.disabled = false;
        
        // 如果還沒設定 Excel 網址，開放給用戶自行選擇，不自動跳轉
        if (GOOGLE_SHEET_CSV_URL.includes("把你發布的CSV網址貼喺度")) {
            return;
        }

        // 去後台讀取該用戶交到第幾週
        fetch(GOOGLE_SHEET_CSV_URL + "?t=" + new Date().getTime())
        .then(res => res.text())
        .then(csvText => {
            let lines = csvText.split(/\r?\n/).map(line => line.split(/,(?=(?:[^"]*"[^"]*")*[^"]*$)/));
            if (lines.length < 2) {
                weekSelect.value = "第1週"; // 沒數據預設第一週
                return;
            }

            let runnerIdx = 1; // 姓名欄
            let weekIdx = 3;   // 週數欄
            
            // 收集此跑手所有交過功課的週數數字
            let submittedWeeks = [];

            for (let i = 1; i < lines.length; i++) {
                let row = lines[i];
                if (!row || row.length <= Math.max(runnerIdx, weekIdx)) continue;
                
                let rowRunner = row[runnerIdx]?.replace(/"/g, '').trim();
                let rowWeek = row[weekIdx]?.replace(/"/g, '').trim();

                if (rowRunner === runner) {
                    // 提取「第X週」裡面的數字
                    let match = rowWeek.match(/\d+/);
                    if (match) {
                        submittedWeeks.push(parseInt(match[0]));
                    }
                }
            }

            let nextWeekNum = 1;
            if (submittedWeeks.length > 0) {
                // 找出他交過的最大週數，然後 +1
                let maxWeek = Math.max(...submittedWeeks);
                nextWeekNum = maxWeek + 1;
            }

            if (nextWeekNum > 40) nextWeekNum = 40; // 上限 40 週

            // 🎯 完美自動鎖定到下一週！
            weekSelect.value = `第${nextWeekNum}週`;
            tip.innerText = `✨ 大數據辨識：你已提交過歷史功課，已為你自動鎖定【第 ${nextWeekNum} 週】！`;
            tip.style.style = "block";
            tip.style.display = 'block';
        })
        .catch(err => {
            console.error('辨識週數失敗:', err);
            weekSelect.value = "第1週"; // 失敗防呆
        });
    }
</script>
</body>
</html>
