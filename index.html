<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Takeitslow 慢跑團 ・ 1km微觀山形對比看板</title>
    <!-- 引入 Chart.js 圖表引擎 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { margin: 0; padding: 20px; background-color: #0c0c0e; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        .dashboard-container { max-width: 1200px; margin: 0 auto; background: #141417; padding: 25px; border-radius: 12px; border: 1px solid #2d2d34; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        h2 { font-size: 24px; color: #fc4c02; margin-top: 0; display: flex; align-items: center; gap: 10px; }
        .filter-section { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; background: #1e1e24; padding: 20px; border-radius: 8px; border: 1px solid #2d2d34; }
        @media(max-width: 768px) { .filter-section { grid-template-columns: 1fr; } }
        label { font-size: 14px; color: #aaaaaa; display: flex; flex-direction: column; gap: 8px; font-weight: bold; }
        select { background: #2a2a35; color: white; border: 1px solid #444; padding: 10px; border-radius: 6px; outline: none; cursor: pointer; font-size: 14px; }
        .checkbox-group { background: #252530; padding: 10px; border-radius: 6px; max-height: 150px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; border: 1px solid #333; }
        .checkbox-label { font-size: 13px; color: #ddd; display: flex; align-items: center; gap: 8px; cursor: pointer; font-weight: normal; }
        .checkbox-label input { width: 16px; height: 16px; cursor: pointer; }
        .chart-box { position: relative; width: 100%; height: 550px; background: #18181c; padding: 15px; border-radius: 8px; box-sizing: border-box; border: 1px solid #23232a; }
        .loading-text { color: #00ffcc; font-size: 16px; text-align: center; padding: 80px 0; font-weight: bold; }
    </style>
</head>
<body>

<div class="dashboard-container">
    <h2>🏃‍♂️ Takeitslow 慢跑團 1km微觀特訓對比看板 (左右互搏版)</h2>
    
    <!-- 日期與多跑手動態過濾篩選器 -->
    <div class="filter-section">
        <label>第一步：選取特訓日期
            <select id="date-select" onchange="onDateChanged()">
                <option value="">-- 📡 正在加載高密度歷史日期 --</option>
            </select>
        </label>
        
        <label>第二步：勾選對比學員 (支援多學員重疊對比)
            <div id="athlete-checkboxes" class="checkbox-group">
                <span style="color:#777; font-size:13px; padding:5px;">請先選取特訓日期</span>
            </div>
        </label>
    </div>

    <!-- 📊 1km 微觀地形混合型科學圖表主舞台 -->
    <div class="chart-box">
        <div id="loading-msg" class="loading-text">📡 正在從 Google 試算表實時同步 1km 微觀數據流...</div>
        <canvas id="multiStravaChart" style="display: none;"></canvas>
    </div>
</div>

<script>
    // 🛑 【核心校準網址】：請在此替換為你 Apps Script 最新部署釋出的網址！
    var GOOGLE_API_URL = "https://script.google.com/macros/s/AKfycbzVhsrXiGin1HCEmsKtvTtdclYkhGGPwimiPu85Z_rGQreoZLwYTH7Qj78pp_GcKLfn/exec";
    
    var rawFetchedData = [];
    var activeChart = null;

    // 左右互搏調色盤配置：為勾選的學員自動分配高對比顏色 (實線為心率，虛線為EPH效益)
    var colorPalette = [
        { hr: '#ff3366', eph: '#ff88aa' },  // 學員 1: 戰術桃紅
        { hr: '#3388ff', eph: '#88bbff' },  // 學員 2: 科學寶藍
        { hr: '#ffcc00', eph: '#ffee77' }   // 學員 3: 警示金黃
    ];

    window.addEventListener('DOMContentLoaded', function() {
        fetchDashboardData();
    });

    /**
     * 📥 自動免抄寫讀數引擎：實時打撈後台 1km 數據
     */
    function fetchDashboardData() {
        fetch(GOOGLE_API_URL + "?action=get_analysis")
        .then(res => res.json())
        .then(data => {
            rawFetchedData = data;
            document.getElementById('loading-msg').style.display = 'none';
            document.getElementById('multiStravaChart').style.display = 'block';
            
            // 提取所有不重複的特訓日期並由新到舊排序
            var uniqueDates = [...new Set(data.map(item => item.date))].sort().reverse();
            var dateSelect = document.getElementById('date-select');
            dateSelect.innerHTML = "";
            
            if(uniqueDates.length === 0) {
                dateSelect.innerHTML = "<option value=''>-- 數據庫內暫無 1km 資料 --</option>";
                return;
            }

            uniqueDates.forEach(d => {
                var opt = document.createElement('option');
                opt.value = d;
                opt.innerText = "📅 特訓日期： " + d;
                dateSelect.appendChild(opt);
            });

            onDateChanged();
        })
        .catch(err => {
            document.getElementById('loading-msg').innerText = "❌ 資料庫通訊失敗。請確保後台已執行數據重灌並產生 1km_Analysis_xxx 分頁。";
        });
    }

    /**
     * 👥 聯動過濾：當日期切換，精準刷新當天有出賽的跑手名單
     */
    function onDateChanged() {
        var selectedDate = document.getElementById('date-select').value;
        var checkboxContainer = document.getElementById('athlete-checkboxes');
        checkboxContainer.innerHTML = "";

        var athletesOnDay = [...new Set(rawFetchedData.filter(item => item.date === selectedDate).map(item => item.name))];

        if(athletesOnDay.length === 0) {
            checkboxContainer.innerHTML = "<span style='color:#777; font-size:13px; padding:5px;'>當天無學員紀錄</span>";
            if(activeChart) activeChart.destroy();
            return;
        }

        athletesOnDay.forEach((name, index) => {
            var label = document.createElement('label');
            label.className = "checkbox-label";
            
            var chk = document.createElement('input');
            chk.type = "checkbox";
            chk.value = name;
            chk.checked = (index < 2); // 預設自動勾選當日前兩位同學重疊對比
            chk.addEventListener('change', updateChartWithFilters);
            
            label.appendChild(chk);
            label.appendChild(document.createTextNode(name));
            checkboxContainer.appendChild(label);
        });

        updateChartWithFilters();
    }

    /**
     * 📊 核心渲染引擎：1km 連續微觀波浪地形與多跑手指標對齊
     */
    function updateChartWithFilters() {
        var selectedDate = document.getElementById('date-select').value;
        var checkedBoxes = document.querySelectorAll('#athlete-checkboxes input:checked');
        var selectedNames = Array.from(checkedBoxes).map(cb => cb.value);

        if (selectedNames.length === 0) {
            if(activeChart) activeChart.destroy();
            return;
        }

        // 1. 物理獲取當天所有數據，並對 X 軸 1km 標籤進行嚴格的「自然順序排序」，防止地形亂跳
        var dayRecords = rawFetchedData.filter(item => item.date === selectedDate);
        var uniqueIntervals = [...new Set(dayRecords.map(item => item.interval))].sort();

        var chartDatasets = [];
        var sharedAltitudeData = new Array(uniqueIntervals.length).fill(0);
        var altitudePopulated = false;

        // 2. 遍歷勾選學員，將其實際心率與 EPH 指標工整對齊 1km X 軸
        selectedNames.forEach((athleteName, aIdx) => {
            var color = colorPalette[aIdx % colorPalette.length];
            var hrArray = [];
            var ephArray = [];

            uniqueIntervals.forEach((intervalName, iIdx) => {
                var record = dayRecords.find(r => r.name === athleteName && r.interval === intervalName);
                if (record) {
                    hrArray.push(parseFloat(record.real_hr) || null);
                    ephArray.push(parseFloat(record.eph_val) || null);
                    
                    // 3. 微觀地形共享提取：將這 1 公里的真實高度紀錄存入地形陣列
                    if (!altitudePopulated && record.max_alt && record.max_alt !== "無") {
                        sharedAltitudeData[iIdx] = parseFloat(record.max_alt);
                    }
                } else {
                    hrArray.push(null);
                    ephArray.push(null);
                }
            });

            if(sharedAltitudeData.some(v => v > 0)) altitudePopulated = true;

            // 實際心率曲線 (工整實線)
            chartDatasets.push({
                label: '❤️ ' + athleteName + ' 實際心率 (HR)',
                data: hrArray,
                borderColor: color.hr,
                backgroundColor: color.hr,
                borderWidth: 3,
                tension: 0.2, // 微幅平滑曲線
                yAxisID: 'yBody'
            });

            // Effort Pace Hour 效益曲線 (工整虛線對比 🎯)
            chartDatasets.push({
                label: '⚡ ' + athleteName + ' 效益指標 (EPH)',
                data: ephArray,
                borderColor: color.hr,
                backgroundColor: color.hr,
                borderWidth: 2,
                borderDash: [5, 4], 
                tension: 0.2,
                yAxisID: 'yBody'
            });
        });

        // 4. 🚀 核心升級：將 1km 高密度微觀波浪山形面積圖優雅地注入背景底層
        chartDatasets.unshift({
            label: '⛰️ 1km微觀連續地形高度 (m)',
            data: sharedAltitudeData,
            backgroundColor: 'rgba(252, 76, 2, 0.08)', // Strava 經典亮橘色高密度背景地形
            borderColor: 'rgba(252, 76, 2, 0.25)',
            borderWidth: 1.5,
            fill: true, // 填滿面積
            pointRadius: 0, // 隱藏頂點圓圈，保持高密度連續波浪感
            yAxisID: 'yAltitude',
            order: 99 // 強制置於底層背景
        });

        // 5. 銷毀舊實體並重新渲染
        if (activeChart) { activeChart.destroy(); }

        var ctx = document.getElementById('multiStravaChart').getContext('2d');
        activeChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: uniqueIntervals,
                datasets: chartDatasets
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    yBody: {
                        type: 'linear',
                        position: 'left',
                        title: { display: true, text: '心率 (bpm) / EPH 效益值', color: '#fff' },
                        grid: { color: '#23232a' },
                        ticks: { color: '#aaa' },
                        min: 90, max: 200 // 最佳化越野跑心率觀測視窗
                    },
                    yAltitude: {
                        type: 'linear',
                        position: 'right',
                        display: false, // 隱藏刻度，讓微觀山形圖優雅退居幕後作為純背景
                        grid: { drawOnChartArea: false }
                    },
                    x: {
                        grid: { color: '#23232a' },
                        ticks: { color: '#aaa' },
                        title: { display: true, text: '特訓高密度 1 公里物理分段 (km)', color: '#aaa' }
                    }
                },
                plugins: {
                    legend: { labels: { color: '#fff', font: { size: 12 } } }
                }
            }
        });
    }
</script>
</body>
</html>
