        .loading-text { font-size: 14px; color: #00ffcc; margin: 10px 0; text-align: center; }
    </style>

    <script>
        var csvMainUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTxdxSecRK-c5JnXNdMqt__8HjZI1mZFP8gP7YF2MSGDQRfj_fheZZnDRih-95CRCbnN3QG7XrJMthY/pub?gid=99162601&single=true&output=csv";
        var GITHUB_USER = "siukit88";

        var _0x5a1b = ["1000", "Kit", "1001", "Nein", "1002", "Simon", "1003", "Alex", "1004", "Sun", "1005", "Jackson", "1006", "Joy", "1007", "George", "1008", "Lip", "1009", "Wing_PTL", "1010", "Jason_PTL", "1011", "Alwyn", "1012", "Camille", "1013", "Fion", "1014", "Daniel", "1015", "KingYan", "1016", "Szero", "1017", "Frances", "1018", "Bianca", "1019", "Mabel", "1020", "Avis", "1021", "Jason", "1022", "Jerry", "1023", "Rita", "1024", "Ruby", "1025", "Calvin Siu", "Thomas", "1026", "Thomas", "1027", "Yin Wai", "1028", "Gary", "1029", "Lois", "1030", "Gaby", "1031", "Carol", "1032", "Timothy", "1033", "Charlotte Lokman", "1034", "Kayan", "1208", "Coach"];
        var _0x3b2c = {}; for(var i=0; i<_0x5a1b.length; i+=2){ _0x3b2c[_0x5a1b[i]] = _0x5a1b[i+1]; }

        var authorizedName = ""; var isCoachMode = false; var allRecords = []; var cachedCsvText = ""; var bioChartInstance = null; var paceChartInstance = null;

        function verifyIdentity() {
            var inputPwd = document.getElementById('user-pwd').value.trim();
            var errField = document.getElementById('login-err'); var nameSelect = document.getElementById('filter-name');
            if (inputPwd === "") return;
            
            if (inputPwd === _0x5a1b[_0x5a1b.length-2]) {
                isCoachMode = true; authorizedName = "Coach";
                var optionsHtml = ''; for(var k in _0x3b2c){ if(k!=="1208") optionsHtml += '<option value="' + _0x3b2c[k] + '">👤 學員：' + _0x3b2c[k] + '</option>'; }
                nameSelect.innerHTML = optionsHtml; nameSelect.removeAttribute('disabled');
                document.getElementById('login-screen').style.display = 'none'; document.getElementById('app-content').style.display = 'block';
                startLoadingData(); return;
            }
            if (_0x3b2c[inputPwd]) {
                isCoachMode = false; authorizedName = _0x3b2c[inputPwd];
                nameSelect.innerHTML = '<option value="' + authorizedName + '">👤 學員：' + authorizedName + '</option>';
                nameSelect.setAttribute('disabled', 'true');
                document.getElementById('login-screen').style.display = 'none'; document.getElementById('app-content').style.display = 'block';
                startLoadingData();
            } else {
                errField.style.display = 'block'; errField.style.color = '#ff4d4d'; errField.innerText = "❌ 門禁安全驗證失敗";
                document.getElementById('user-pwd').value = "";
            }
        }

        function startLoadingData() {
            var statusEl = document.getElementById('loading-status');
            if(statusEl) statusEl.style.display = 'block';
            fetch(csvMainUrl + "&t=" + new Date().getTime())
                .then(function(res) { 
                    if(!res.ok) { throw new Error('CSV Link Error'); }
                    return res.text(); 
                })
                .then(function(text) { cachedCsvText = text; parseAndFilterData(); })
                .catch(function(err) { 
                    var statusEl2 = document.getElementById('loading-status');
                    if(statusEl2) statusEl2.innerText = "❌ 雲端同步失敗。"; 
                });
        }

        function parseStandardCSV(csvText) {
            var lines = []; var currentLine = []; var currentCell = ''; var inQuotes = false;
            var normalized = csvText.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
            for (var i = 0; i < normalized.length; i++) {
                var c = normalized[i];
                if (c === '"') { inQuotes = !inQuotes; }
                else if (c === ',' && !inQuotes) { currentLine.push(currentCell.trim()); currentCell = ''; }
                else if (c === '\n' && !inQuotes) { currentLine.push(currentCell.trim()); lines.push(currentLine); currentLine = []; currentCell = ''; }
                else { currentCell += c; }
            }
            if (currentCell || currentLine.length > 0) { currentLine.push(currentCell.trim()); lines.push(currentLine); }
            return lines;
        }

        function parseAndFilterData() {
            try {
                var lines = parseStandardCSV(cachedCsvText);
                var weekSelect = document.getElementById('filter-week'); var nameSelect = document.getElementById('filter-name');
                var targetName = nameSelect.value ? nameSelect.value.trim() : authorizedName;
                var cleanTarget = targetName.replace(/\s+/g, "").toLowerCase();
                
                allRecords = []; var weeks = {};
                if(lines && lines.length > 1) {
                    var idxName = 1; var idxWeek = 2; var idxDist = 3; var idxTime = 4;
                    var idxCadence = 5; var idxStride = 6; var idxHr = 7; var idxRisk = 8;
                    var idxWeather = 9; var idxSupply = 10; var idxClimb = 11;

                    for(var i = 1; i < lines.length; i++) {
                        var row = lines[i];
                        if(row && row.length > idxName && row[idxName]) {
                            var cleanCellName = row[idxName].replace(/\s+/g, "").toLowerCase();
                            if(cleanCellName === cleanTarget || (cleanTarget === "nein" && cleanCellName === "nien") || (cleanTarget === "nien" && cleanCellName === "nein")) {
                                var wValue = row[idxWeek] ? row[idxWeek].toString().trim() : "1";
                                allRecords.push({ 
                                    timestamp: row[0]||"--", name: row[idxName].trim(), week: wValue, 
                                    distance: row[idxDist]||"0", time: row[idxTime]||"--", cadence: row[idxCadence]||"0", 
                                    stride: row[idxStride]||"0", hr: row[idxHr]||"0", risk: row[idxRisk]||"良好", 
                                    weather: row[idxWeather]||"正常", supply: row[idxSupply]||"正常", climb: row[idxClimb]||"0",
                                    rawRowPackage: row 
                                });
                                // 🟢 儲存純粹的原始週數指紋
                                weeks[wValue] = true;
                            }
                        }
                    }
                }

                weekSelect.innerHTML = '<option value="">選擇週數...</option>';
                
                // 🟢 【去骨排序】：抽離所有非數字，純數值排序週數
                var sortedWeeks = Object.keys(weeks).sort(function(a,b){
                    return parseInt(a.replace(/[^0-9]/g, '')) - parseInt(b.replace(/[^0-9]/g, ''));
                });
                
                sortedWeeks.forEach(function(w) { 
                    // 確保選單外觀高雅，不論 Google Sheet 傳啥，選單一律統整呈現「第 x 週」
                    var cleanNum = w.replace(/[^0-9]/g, '');
                    var displayName = "第 " + (cleanNum || w) + " 週";
                    weekSelect.innerHTML += '<option value="' + w + '">' + displayName + '</option>'; 
                });
                
                document.getElementById('loading-status').style.display = 'none';
                
                var currentWeek = weekSelect.value;
                if(allRecords && allRecords.length > 0) { 
                    var last = allRecords[allRecords.length - 1]; 
                    if(last) { weekSelect.value = last.week; currentWeek = last.week; }
                }
                if(!currentWeek && sortedWeeks.length > 0) { currentWeek = sortedWeeks[sortedWeeks.length - 1]; weekSelect.value = currentWeek; }
                
                updateDisplay(currentWeek);
            } catch (error) { document.getElementById('loading-status').innerText = "❌ 數據解析錯誤。"; }
        }
    </script>
</head>
<body>

<div id="login-screen" class="login-overlay">

<script>
    function clearDisplayFields() {
        document.getElementById('val-date').innerText = "--"; document.getElementById('val-distance').innerText = "--"; 
        document.getElementById('val-time').innerText = "--"; document.getElementById('val-cadence').innerText = "--"; 
        document.getElementById('val-stride').innerText = "--"; document.getElementById('val-hr').innerText = "--";
        document.getElementById('val-risk').innerText = "--"; document.getElementById('val-weather').innerText = "--";
        document.getElementById('val-supply').innerText = "--"; document.getElementById('val-climb').innerText = "--";
        document.getElementById('val-eph').innerText = "--"; document.getElementById('val-feedback').innerText = "--";
    }

    function updateDisplay(selectedWeek) {
        var nameSelect = document.getElementById('filter-name');
        var currentRunner = nameSelect.value ? nameSelect.value.trim() : authorizedName;
        
        clearDisplayFields();

        // 🟢 【去骨配對核心】：兩端字串通通熔解成純數字進行 100% 齒輪對比
        var targetNumStr = (selectedWeek || "").toString().replace(/[^0-9]/g, '');
        var matched = allRecords.find(function(r) { 
            return r.week.toString().replace(/[^0-9]/g, '') === targetNumStr; 
        });
        
        var distNum = 0; var climbNum = 0; var hrNum = 0;
        
        if (matched) {
            document.getElementById('val-date').innerText = matched.timestamp.split(' ')[0] || matched.timestamp;
            document.getElementById('val-distance').innerText = matched.distance + " km"; 
            document.getElementById('val-time').innerText = matched.time; 
            document.getElementById('val-cadence').innerText = matched.cadence + " spm"; 
            document.getElementById('val-stride').innerText = matched.stride + " m";
            document.getElementById('val-hr').innerText = matched.hr + " bpm";
            document.getElementById('val-climb').innerText = matched.climb + " 米";
            document.getElementById('val-risk').innerText = matched.risk;
            document.getElementById('val-weather').innerText = matched.weather;
            document.getElementById('val-supply').innerText = matched.supply;

            distNum = parseFloat(matched.distance) || 0; 
            climbNum = parseFloat(matched.climb) || 0;
            hrNum = parseInt(matched.hr) || 0;

            var pct = Math.min(100, Math.max(10, (hrNum / 200) * 100));
            document.getElementById('hr-bar').style.width = pct + "%";

            var hoursNum = 0;
            if (matched.time) {
                var match = matched.time.match(/([0-9]{1,2}):([0-9]{2}):([0-9]{2})/);
                if (match) { hoursNum = parseInt(match[1]) + (parseInt(match[2]) / 60) + (parseInt(match[3]) / 3600); }
            }
            if (hoursNum > 0) {
                document.getElementById('val-eph').innerText = ((distNum + (climbNum / 100)) / hoursNum).toFixed(2) + " EP/小時";
            }
        }

        var effectiveDist = distNum > 0 ? distNum : 10;
        var xLabels = ['0km', (effectiveDist*0.2).toFixed(2)+'km', (effectiveDist*0.4).toFixed(2)+'km', (effectiveDist*0.6).toFixed(2)+'km', (effectiveDist*0.8).toFixed(2)+'km', effectiveDist + 'km'];
        
        var finalClimbData = [Math.round(climbNum*0.01), Math.round(climbNum*0.28), Math.round(climbNum*0.41), Math.round(climbNum*0.07), Math.round(climbNum*0.41), Math.round(climbNum*0.20)];
        var finalHrData = hrNum > 0 ? [hrNum - 15, hrNum + 8, hrNum + 18, hrNum - 22, hrNum + 12, hrNum - 7] : [120, 140, 155, 135, 160, 145];
        var finalPowerData = hrNum > 0 ? [Math.round(hrNum*1.3), Math.round(hrNum*1.6), Math.round(hrNum*1.4), Math.round(hrNum*1.8), Math.round(hrNum*1.5), Math.round(hrNum*1.35)] : [160, 210, 190, 240, 200, 170];

        if (matched) {
            var rowPack = matched.rawRowPackage;
            if (rowPack && rowPack.length > 12) {
                var streams = [];
                for (var colIdx = 12; colIdx < rowPack.length; colIdx++) {
                    if (rowPack[colIdx] && (rowPack[colIdx].indexOf(',') !== -1 || rowPack[colIdx].indexOf('[') !== -1)) {
                        streams.push(rowPack[colIdx].toString().trim().replace(/[\[\]"]/g, ""));
                    }
                }
                if (streams[0] && streams[0].trim() !== "") { finalClimbData = streams[0].split(',').map(Number); }
                if (streams[1] && streams[1].trim() !== "") { finalHrData = streams[1].split(',').map(Number); }
                if (streams[2] && streams[2].trim() !== "") { finalPowerData = streams[2].split(',').map(Number); }
            }
        }

        renderPrimaryCharts(xLabels, finalClimbData, finalHrData, finalPowerData);
        
        // 📡 🚀 【雙向強制爆發點】：傳入純數字指紋週數，強制打穿 Gist 後台提取大數據文字
        bgFetchGistFeedback(currentRunner, targetNumStr, effectiveDist);
    }

    function renderPrimaryCharts(xLabels, climbData, hrData, powerData) {
        try {
            if (bioChartInstance) bioChartInstance.destroy();
            bioChartInstance = new Chart(document.getElementById('bioMetricsChart').getContext('2d'), {
                type: 'line',
                data: {
                    labels: xLabels,
                    datasets: [
                        { label: '實時心率 (bpm)', data: hrData, borderColor: '#ff3366', fill: false, tension: 0.2, yAxisID: 'y', pointRadius: hrData.length > 20 ? 0 : 3, borderWidth: 2 },
                        { label: '輸出功率 (W)', data: powerData, borderColor: '#3a86ff', fill: false, tension: 0.2, yAxisID: 'y2', pointRadius: powerData.length > 20 ? 0 : 3, borderWidth: 2 },
                        { label: '[背景] 實際爬升高度', data: climbDa
