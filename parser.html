<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kit Coach 數據智能提取中心 v52.0</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.0.3/dist/tesseract.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #121212; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #ffffff; }
        .phone-container { width: 100%; max-width: 412px; min-height: 100vh; background: #16161a; margin: 0 auto; padding: 20px 20px 40px 20px; box-sizing: border-box; }
        .header { background: #00f2fe; padding: 20px; margin: -20px -20px 20px -20px; text-align: left; color: #121212; }
        .header h1 { margin: 0; font-size: 20px; font-weight: bold; }
        .header p { margin: 5px 0 0 0; font-size: 12px; opacity: 0.8; font-weight: bold; }
        .upload-zone { display: flex; gap: 12px; margin-bottom: 25px; }
        .upload-card { flex: 1; background: #1e1e24; border-radius: 8px; padding: 15px 10px; text-align: center; cursor: pointer; border: 2px dashed #444; box-sizing: border-box; }
        .upload-card.fit { border-color: #00f2fe; }
        .upload-card.img { border-color: #ff3366; }
        .icon { font-size: 24px; display: block; margin-bottom: 6px; }
        .card-title { font-size: 13px; font-weight: bold; }
        .upload-card.fit .card-title { color: #00f2fe; }
        .upload-card.img .card-title { color: #ff3366; }
        .card-desc { font-size: 11px; color: #888; margin-top: 4px; }
        .result-box { background: #1e1e24; border-radius: 8px; padding: 15px; margin-bottom: 20px; border: 1px solid #333; }
        .result-box h3 { margin: 0 0 12px 0; font-size: 15px; border-bottom: 1px solid #333; padding-bottom: 8px; color: #00f2fe; }
        .data-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed #2a2a35; }
        .data-row:last-child { border: none; }
        .data-label { color: #aaa; font-size: 14px; }
        .data-input { background: #16161a; border: 1px solid #444; border-radius: 4px; color: #fff; padding: 6px 10px; font-size: 14px; text-align: right; width: 140px; font-weight: bold; outline: none; }
        .data-input:focus { border-color: #00f2fe; }
        .btn-action { width: 100%; padding: 15px; background: #ff3366; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-action:active { background: #d62250; }
        .hidden-file { display: none !important; }
        .nav-link { display: inline-block; color: #aaa; font-size: 14px; text-decoration: none; margin-top: 20px; width: 100%; text-align: center; }
    </style>
</head>
<body>

<div class="phone-container">
    <div class="header">
        <h1>Kit Coach 數據智能提取中心</h1>
        <p>精確數據過濾清洗版：拒絕錯位抓取 v52.0</p>
    </div>

    <div class="upload-zone">
        <div class="upload-card fit" id="fitTriggerBtn">
            <span class="icon">⚡</span>
            <div class="card-title">投放 .FIT 原始檔</div>
            <div class="card-desc">動態過濾 Lap/高度錯位字節</div>
            <input type="file" id="localFitInput" class="hidden-file" accept=".fit">
        </div>
        <div class="upload-card img" id="imgTriggerBtn">
            <span class="icon">📸</span>
            <div class="card-title">上載數據截圖</div>
            <div class="card-desc">專利正則清洗干擾數字</div>
            <input type="file" id="localImgInput" class="hidden-file" accept="image/*">
        </div>
    </div>

    <div class="result-box">
        <h3>📊 數據提取核對面板 (支持手動校正)</h3>
        <div class="data-row"><span class="data-label">長距離 (km) ：</span><input type="text" class="data-input" id="res_distance" placeholder="--"></div>
        <div class="data-row"><span class="data-label">爬升海拔 (米) ：</span><input type="text" class="data-input" id="res_elevation" placeholder="--"></div>
        <div class="data-row"><span class="data-label">長跑時間：</span><input type="text" class="data-input" id="res_duration" placeholder="--"></div>
        <div class="data-row"><span class="data-label">平均步頻 (spm) ：</span><input type="text" class="data-input" id="res_cadence" placeholder="--"></div>
        <div class="data-row"><span class="data-label">平均心率 (bpm) ：</span><input type="text" class="data-input" id="res_hr" placeholder="--"></div>
    </div>

    <button class="btn-action" onclick="copyToClipboardV52()">📋 一鍵複製數據 (準備貼上)</button>
    
    <a href="submit.html" class="nav-link">⬅ 返回功課回報主頁 (submit.html)</a>
</div>

<script>
    document.getElementById('fitTriggerBtn').onclick = function() { document.getElementById('localFitInput').click(); };
    document.getElementById('imgTriggerBtn').onclick = function() { document.getElementById('localImgInput').click(); };

    // 🟢 1. .FIT 原始文件解碼通道（加入最後一筆總結鎖定，防止抓錯前面的 Lap 數據）
    document.getElementById('localFitInput').onchange = function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(event) {
            try {
                const buffer = event.target.result;
                const view = new DataView(buffer);
                let finalDist = 0, finalTime = 0, finalClimb = 0, finalHr = 0, finalCad = 0;
                let foundValid = false;

                // 逆向掃描或嚴格過濾定義，只尋找真正合理的總摘要區塊
                for (let i = 14; i < buffer.byteLength - 40; i++) {
                    if (view.getUint8(i) === 0x40 && view.getUint8(i+1) === 0x00 && view.getUint8(i+2) > 4) {
                        let fCount = view.getUint8(i + 2);
                        let ptr = i + 3;
                        let offsets = { 5: -1, 7: -1, 16: -1, 18: -1, 25: -1 };
                        let curPos = 0;

                        for (let f = 0; f < fCount; f++) {
                            if (ptr + 2 >= buffer.byteLength) break;
                            let id = view.getUint8(ptr);
                            let sz = view.getUint8(ptr + 1);
                            if (offsets[id] !== undefined) offsets[id] = curPos;
                            curPos += sz; ptr += 3;
                        }

                        if (offsets[5] !== -1 && offsets[7] !== -1 && ptr + curPos < buffer.byteLength) {
                            let dStart = ptr;
                            let d = view.getUint32(dStart + offsets[5], true) / 100000;
                            let t = view.getUint32(dStart + offsets[7], true) / 1000;
                            
                            // 🔒 範圍清洗門檻：里程必須符合正常訓練範圍，且時間大於 5 分鐘，排除單圈/高度雜訊
                            if (d > 1.0 && d < 150 && t > 300) {
                                finalDist = d; 
                                finalTime = t;
                                if (offsets[16] !== -1) finalHr = view.getUint8(dStart + offsets[16]);
                                if (offsets[18] !== -1) { let c = view.getUint8(dStart + offsets[18]); finalCad = c < 120 ? c * 2 : c; }
                                if (offsets[25] !== -1) {
                                    let c = view.getUint16(dStart + offsets[25], true);
                                    finalClimb = c > 12000 ? Math.round(c / 100) : (c > 4000 ? Math.round(c / 10) : c);
                                    if (finalClimb > 4000) finalClimb = 0;
                                }
                                foundValid = true;
                                // 繼續循環，讓最後一筆（通常是整場運動的總結）覆蓋前面的單圈數據
                            }
                        }
                    }
                }

                if (foundValid && finalDist > 0.1) {
                    document.getElementById('res_distance').value = finalDist.toFixed(2);
                    document.getElementById('res_elevation').value = (finalClimb >= 0 && finalClimb < 5000) ? finalClimb : "0";
                    const hrs = String(Math.floor(finalTime / 3600)).padStart(2, '0');
                    const mins = String(Math.floor((finalTime % 3600) / 60)).padStart(2, '0');
                    const secs = String(Math.round(finalTime % 60)).padStart(2, '0');
                    document.getElementById('res_duration').value = `${hrs}:${mins}:${secs}`;
                    document.getElementById('res_hr').value = (finalHr > 40 && finalHr < 220) ? finalHr : "";
                    document.getElementById('res_cadence').value = (finalCad > 100 && finalCad < 240) ? finalCad : "";
                    alert(`⚡ .FIT 數據清洗完畢！\n🏃 已鎖定整場特訓總里程：${finalDist.toFixed(2)} km`);
                } else {
                    throw new Error("過濾後未發現合理的運動摘要");
                }
            } catch (err) {
                alert("❌ .FIT 自動過濾未能完全對齊。\n💡 面板已為您開放，請改用「數據截圖」識別，或直接在此修正填報！");
            }
        };
        reader.readAsArrayBuffer(file);
    };

    // 📸 2. 圖片智慧 OCR 通道（精確過濾配速/心率干擾，只抓里程與時間）
    document.getElementById('localImgInput').onchange = function(e) {
        const file = e.target.files[0];
        if (!file) return;

        alert("⏳ 正在啟動高精準圖像清洗識別，請稍候 3-5 秒...");

        Tesseract.recognize(file, 'eng').then(({ data: { text } }) => {
            console.log("OCR Filtered Raw Text:", text);
            
            // 🎯 正規表達式 A：精確捕獲「帶有 km/KM 單位」或符合「兩位數.兩位數」的獨立大里程
            const kmRegex = /(\d+[\.,]\d{2})\s*(km|公里|KM|Km)/i;
            const kmMatch = text.match(kmRegex);
            
            // 🎯 正規表達式 B：精確捕獲符合「時:分:秒」長度的長跑時間
            const timeRegex = /(\d{2}:\d{2}:\d{2})/;
            const timeMatch = text.match(timeRegex);

            let hasImgData = false;

            if (kmMatch && kmMatch[1]) {
                let cleanNum = kmMatch[1].replace(',', '.');
                let distFloat = parseFloat(cleanNum);
                if (distFloat > 0.5 && distFloat < 150) {
                    document.getElementById('res_distance').value = distFloat.toFixed(2);
                    hasImgData = true;
                }
            } else {
                // 備用：如果沒帶單位，抓取畫面上第一個獨立的「XX.XX」大數字（通常是里程）
                const fallbackMatch = text.match(/\b(\d{2}\.\d{2})\b/);
                if (fallbackMatch && fallbackMatch[1]) {
                    document.getElementById('res_distance').value = parseFloat(fallbackMatch[1]).toFixed(2);
                    hasImgData = true;
                }
            }

            if (timeMatch && timeMatch[1]) {
                document.getElementById('res_duration').value = timeMatch[1];
                hasImgData = true;
            }

            if (hasImgData) {
                alert("📸 截圖智能清洗完畢！已過濾配速等雜訊，提取出核心指標。");
            } else {
                alert("⚠️ 讀取完成！但未能在截圖上過濾出標準的里程(km)或時間，請手動在面板修改補全。");
            }
        }).catch(err => {
            alert("📸 圖像引擎超時，請直接在面板填寫數值。");
        });
    };

    function copyToClipboardV52() {
        const dist = document.getElementById('res_distance').value;
        const climb = document.getElementById('res_elevation').value;
        const time = document.getElementById('res_duration').value;
        const cad = document.getElementById('res_cadence').value;
        const hr = document.getElementById('res_hr').value;

        if (!dist && !time) {
            alert('⚠️ 面板尚無數據，請先輸入或投放檔案/圖片。');
            return;
        }

        const dataText = `【特訓里程】 ${dist || '--'} km \n【爬升海拔】 ${climb || '--'} 米 \n【長跑時間】 ${time || '--'}\n【平均步頻】 ${cad || '--'} spm\n【平均心率】 ${hr || '--'} bpm`;
        navigator.clipboard.writeText(dataText).then(() => {
            alert('📋 功課數據已完美複製到剪貼簿！\n請返回你的主頁 (submit.html)，直接貼上對照填入即可。');
        }).catch(() => {
            alert('❌ 複製失敗。');
        });
    }
</script>
</body>
</html>
