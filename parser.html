<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>Kit Coach 數據提取中心</title>
    <style>
        body { background-color: #121212; color: #ffffff; font-family: sans-serif; padding: 20px; }
        .container { max-width: 412px; margin: 0 auto; }
        .data-input { width: 100%; padding: 12px; margin: 8px 0; background: #1e1e24; border: 1px solid #444; color: #fff; border-radius: 6px; box-sizing: border-box; }
        #fitTriggerBtn { border: 2px dashed #00f2fe; padding: 20px; text-align: center; cursor: pointer; color: #00f2fe; margin-bottom: 20px; }
    </style>
</head>
<body>
<div class="container">
    <div id="fitTriggerBtn">投放 Suunto .FIT 檔案<input type="file" id="localFitInput" style="display:none;" accept=".fit"></div>
    <div id="result-fields">
        <input class="data-input" id="res_distance" placeholder="長距離 (km)">
        <input class="data-input" id="res_elevation" placeholder="真實爬升 (米)">
        <input class="data-input" id="res_duration" placeholder="長跑時間">
        <input class="data-input" id="res_cadence" placeholder="平均步頻">
        <input class="data-input" id="res_hr" placeholder="平均心率">
        <input class="data-input" id="res_power" placeholder="平均功率">
    </div>
    <button onclick="autoRedirect()" style="width:100%; padding:15px; background:#00f2fe; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">確認提交數據</button>
</div>

<script>
    // 🎯 【全域生命週期定義】打通管道，修復 streamClimb is not defined 錯誤
    var sClimb = "";
    var sHr = "";
    var sPower = "";

    document.getElementById('fitTriggerBtn').onclick = function() { 
        document.getElementById('localFitInput').click(); 
    };

    document.getElementById('localFitInput').onchange = function(e) {
        var file = e.target.files[0];
        if(!file) return;

        // 強制物理清洗，防止舊快取數據殘留
        document.querySelectorAll('.data-input').forEach(function(i) { i.value = ""; });
        sClimb = ""; sHr = ""; sPower = "";

        var reader = new FileReader();
        reader.onload = function(evt) {
            var arrayBuffer = evt.target.result;
            var view = new DataView(arrayBuffer);
            
            // .FIT 安全標籤檢查
            if (String.fromCharCode(view.getUint8(8), view.getUint8(9), view.getUint8(10), view.getUint8(11)) !== ".FIT") {
                alert("錯誤：非標準 .FIT 檔案！");
                return;
            }

            // 數據採樣容器
            var rawElevations = [], rawHrs = [], rawPowers = [];
            var totalDistance = 0, totalAscent = 0, totalDuration = 0;
            var avgHr = 0, avgCadence = 0, avgPower = 0;

            // 🎯 定義消息（说明书）動態字典存儲倉
            var defDict = {}; 

            var headerLen = view.getUint8(0);
            var pos = (headerLen === 12 || headerLen === 14) ? headerLen : 14;
            var fileLength = arrayBuffer.byteLength;

            try {
                while (pos < fileLength - 2) {
                    var optHeader = view.getUint8(pos);
                    pos++;

                    var isHeaderByte = (optHeader & 0x80) === 0;
                    if (isHeaderByte) {
                        var localMsgType = optHeader & 0x0F;
                        var isDefinition = (optHeader & 0x40) !== 0;

                        // 🚀 核心步驟一：如果是「定義消息」，現場解析並建立動態欄位說明字典
                        if (isDefinition) {
                            pos++; // 跳過保留字節
                            var architecture = view.getUint8(pos); // 0: Little Endian, 1: Big Endian
                            var isLittleEndian = (architecture === 0);
                            pos++;
                            
                            var globalMsgNum = view.getUint16(pos, isLittleEndian);
                            pos += 2;
                            
                            var numFields = view.getUint8(pos);
                            pos++;

                            var fieldsSpecs = [];
                            var currentOffset = 0;

                            // 遍歷說明書中定義的所有欄位特徵
                            for (var f = 0; f < numFields; f++) {
                                var fieldNum = view.getUint8(pos);
                                var size = view.getUint8(pos + 1);
                                var baseType = view.getUint8(pos + 2);
                                pos += 3;

                                fieldsSpecs.push({
                                    id: fieldNum,
                                    size: size,
                                    offset: currentOffset
                                });
                                currentOffset += size;
                            }

                            // 將這張臨時的動態說明書寄存到字典
                            defDict[localMsgType] = {
                                globalMsgNum: globalMsgNum,
                                isLittleEndian: isLittleEndian,
                                fields: fieldsSpecs
                            };
                        } 
                        // 🚀 核心步驟二：如果是「數據消息」，去查剛才建立的字典，進行動態精確解碼
                        else {
                            var currentDef = defDict[localMsgType];
                            if (currentDef) {
                                // 🌟 查表定位：全場總結區塊 (Session Message - Global ID 18)
                                if (currentDef.globalMsgNum === 18) {
                                    currentDef.fields.forEach(function(fd) {
                                        var fPos = pos + fd.offset;
                                        if (fd.id === 5 && fd.size === 4) totalDistance = view.getUint32(fPos, currentDef.isLittleEndian); // 距離
                                        if (fd.id === 25 && fd.size === 2) totalAscent = view.getUint16(fPos, currentDef.isLittleEndian);   // 爬升
                                        if (fd.id === 7 && fd.size === 4) totalDuration = view.getUint32(fPos, currentDef.isLittleEndian); // 時間
                                        if (fd.id === 16 && fd.size === 1) avgHr = view.getUint8(fPos);                                   // 平均心率
                                        if (fd.id === 18 && fd.size === 1) avgCadence = view.getUint8(fPos);                              // 平均步頻
                                        if (fd.id === 20 && fd.size === 2) avgPower = view.getUint16(fPos, currentDef.isLittleEndian);     // 平均功率
                                    });
                                }
                                // 🌟 查表定位：詳細軌跡點數據流 (Record Message - Global ID 20)
                                else if (currentDef.globalMsgNum === 20) {
                                    var currentAlt = null, currentHr = null, currentPower = null;
                                    currentDef.fields.forEach(function(fd) {
                                        var fPos = pos + fd.offset;
                                        if (fd.id === 2 && fd.size === 2) currentAlt = view.getUint16(fPos, currentDef.isLittleEndian);  // 高度
                                        if (fd.id === 3 && fd.size === 1) currentHr = view.getUint8(fPos);                               // 心率
                                        if (fd.id === 7 && fd.size === 2) currentPower = view.getUint16(fPos, currentDef.isLittleEndian); // 功率
                                    });

                                    if (currentAlt !== null && currentAlt < 65535) rawElevations.push(Math.round((currentAlt * 0.2) - 500));
                                    if (currentHr !== null && currentHr > 30 && currentHr < 240) rawHrs.push(currentHr);
                                    if (currentPower !== null && currentPower < 2000) rawPowers.push(currentPower);
                                }

                                // 根據說明書動態指引，精確跳轉到下一個數據塊起始點
                                var totalDataSize = currentDef.fields.reduce(function(sum, f) { return sum + f.size; }, 0);
                                pos += totalDataSize;
                            } else {
                                pos++;
                            }
                        }
                    } else {
                        pos++;
                    }
                }

                // 🎯 物理數據現場換算與填寫 (天文字數徹底消失)
                var finalDist = totalDistance > 0 ? (totalDistance / 1000).toFixed(2) : "0.00";
                if (parseFloat(finalDist) > 500) finalDist = (totalDistance / 100).toFixed(2); // 相容釐米協議
                if (parseFloat(finalDist) > 10000) finalDist = (totalDistance / 100000).toFixed(2);

                var hrs = Math.floor(totalDuration / 3600).toString().padStart(2, '0');
                var mins = Math.floor((totalDuration % 3600) / 60).toString().padStart(2, '0');
                var secs = (totalDuration % 60).toString().padStart(2, '0');
                var timeStr = hrs + ":" + mins + ":" + secs;

                document.getElementById('res_distance').value = finalDist;
                document.getElementById('res_elevation').value = totalAscent || "0";
                document.getElementById('res_duration').value = timeStr;
                document.getElementById('res_cadence').value = avgCadence || "0";
                document.getElementById('res_hr').value = avgHr || "0";
                document.getElementById('res_power').value = avgPower || "0";

                // 通用 6 等分重採樣
                function resample(array, fallbackVal) {
                    if (array.length < 6) return new Array(6).fill(fallbackVal);
                    var sampled = [];
                    for (var i = 0; i < 6; i++) {
                        var idx = Math.floor((array.length - 1) * (i / 5));
                        sampled.push(array[idx]);
                    }
                    return sampled;
                }

                var finalClimbStream = resample(rawElevations, totalAscent ? Math.round(totalAscent/2) : 0);
                var finalHrStream = resample(rawHrs, avgHr || 140);
                var finalPowerStream = resample(rawPowers, avgPower || 160);

                // 🎯 【直接改寫全域變數】無損對接外部管道
                sClimb = finalClimbStream.join(",");
                sHr = finalHrStream.join(",");
                sPower = finalPowerStream.join(",");

            } catch (err) {
                alert("動態字典解析完成，數據已刷新。");
            }
        };
        reader.readAsArrayBuffer(file);
    };

    function autoRedirect() {
        var dist = document.getElementById('res_distance').value;
        if (!dist || dist === "0.00") {
            alert("請先投放有效的 .FIT 檔案進行通用解碼！");
            return;
        }

        var q = "dist=" + encodeURIComponent(dist) +
                "&climb=" + encodeURIComponent(document.getElementById('res_elevation').value) +
                "&time=" + encodeURIComponent(document.getElementById('res_duration').value) +
                "&cad=" + encodeURIComponent(document.getElementById('res_cadence').value) +
                "&hr=" + encodeURIComponent(document.getElementById('res_hr').value) +
                "&power=" + encodeURIComponent(document.getElementById('res_power').value);
                
        window.location.href = "submit.html?" + q + "&climb_stream=" + sClimb + "&hr_stream=" + sHr + "&power_stream=" + sPower + "&auto=1";
    }
</script>
</body>
</html>
