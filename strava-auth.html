<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Takeitslow 慢跑團 ・ Strava 數據自動化授權</title>
    <style>
        body { margin: 0; padding: 0; background-color: #121212; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; text-align: center; padding-top: 60px; }
        .container { max-width: 400px; margin: 0 auto; background: #16161a; padding: 30px; border-radius: 8px; box-sizing: border-box; border: 1px solid #ff3366; }
        h2 { font-size: 20px; color: #ffffff; margin-bottom: 10px; }
        p { font-size: 14px; color: #aaaaaa; line-height: 1.6; }
        .btn-strava { display: inline-block; background-color: #FC4C02; color: #ffffff; border: none; padding: 14px 24px; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; text-decoration: none; margin-top: 20px; transition: background 0.2s; }
        .btn-strava:hover { background-color: #e24301; }
        .status-box { margin-top: 25px; padding: 15px; background: #22222b; border-radius: 6px; border: 1px solid #00ffcc; text-align: left; word-break: break-all; }
        .token-val { color: #00ffcc; font-family: monospace; font-size: 14px; background: #121212; padding: 8px; display: block; border-radius: 4px; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2>🏃‍♂️ Takeitslow 慢跑團</h2>
    <p>智慧特訓自動化對流系統</p>
    <p style="font-size: 12px; color: #666;">教練提醒：每位學員只需在此點擊授權一次，以後跑步功課將直接免手動同步至看板！</p>
    
    <!-- 🎯 步驟一：學員點擊按鈕，啟動官方物理授權 -->
    <a id="auth-link" href="#" class="btn-strava">🧡 連接我的 Strava 帳號</a>

    <div class="status-box" id="status-zone" style="display: none;">
        <h4 id="status-title" style="margin: 0 0 10px 0; color: #00ffcc;">🔄 正在與 Strava 交換安全憑證...</h4>
        <div id="status-desc" style="font-size: 13px; color: #dddddd;">請稍候，正在為你生成永久自動同步密鑰。</div>
    </div>
</div>

<script>
    // 🔒 智慧鎖定：封裝教練官方 API 認證資訊
    var STRAVA_CLIENT_ID = "266268"; 
    var STRAVA_CLIENT_SECRET = "e304eac78b700095d7f114432f7ee0ed647c2fae";
    
    // 🎯 智慧鎖定：自動對接你剛創立的 Google 試算表後端接收大腦網址！
    var GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzVhsrXiGin1HCEmsKtvTtdclYkhGGPwimiPu85Z_rGQreoZLwYTH7Qj78pp_GcKLfn/exec";
    
    // 全自動獲取當前的網頁網址作為回呼目標
    var REDIRECT_URI = window.location.href.split('?')[0]; 

    // 初始化建構 Strava 官方授權連結
    document.getElementById('auth-link').href = "https://www.strava.com/oauth/authorize?" +
        "client_id=" + STRAVA_CLIENT_ID +
        "&redirect_uri=" + encodeURIComponent(REDIRECT_URI) +
        "&response_type=code" +
        "&approval_prompt=auto" +
        "&scope=activity:read_all";

    // 🎯 步驟二：當網頁加載時，全自動檢查網址列是否帶有 Strava 回傳的 ?code=xxxx
    window.addEventListener('DOMContentLoaded', function() {
        var urlParams = new URLSearchParams(window.location.search);
        var authCode = urlParams.get('code');

        if (authCode) {
            document.getElementById('status-zone').style.display = 'block';
            document.getElementById('auth-link').style.display = 'none';

            // 即刻向 Strava 伺服器發動認證交換
            exchangeStravaToken(authCode);
        }
    });

    function exchangeStravaToken(code) {
        var tokenExchangeUrl = "https://www.strava.com/oauth/token";
        
        var payload = {
            client_id: STRAVA_CLIENT_ID,
            client_secret: STRAVA_CLIENT_SECRET,
            code: code,
            grant_type: "authorization_code"
        };

        fetch(tokenExchangeUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        })
        .then(function(res) {
            if (!res.ok) throw new Error("Exchange Failed");
            return res.json();
        })
        .then(function(data) {
            // 🟢 成功從 Strava 換到密鑰
            var athleteName = (data.athlete && data.athlete.firstname) ? data.athlete.firstname : "跑手";
            if (data.athlete && data.athlete.lastname) { athleteName += " " + data.athlete.lastname; }
            
            var athleteId = data.athlete ? data.athlete.id : "unknown";
            var permRefreshToken = data.refresh_token;

            document.getElementById('status-title').innerText = "⚡ Strava 授權成功！正在寫入雲端表格...";
            document.getElementById('status-desc').innerHTML = "👤 跑手姓名：" + athleteName + "<br>⏳ 正在安全傳輸金鑰至教練的 Google 試算表，請勿關閉網頁...";

            // 🎯 步驟三：全自動啟動「第二重物理傳輸」，將金鑰射向 Google Apps Script 網址
            sendTokenToGoogleSheet(athleteId, athleteName, permRefreshToken);
        })
        .catch(function(err) {
            document.getElementById('status-title').innerText = "❌ 授權認證交換失敗";
            document.getElementById('status-title').style.color = "#ff3366";
            document.getElementById('status-desc').innerText = "請確保你的 Authorization Callback Domain 與當前網域 100% 吻合。";
        });
    }

    function sendTokenToGoogleSheet(id, name, token) {
        var googlePayload = {
            athlete_id: id,
            athlete_name: name,
            refresh_token: token
        };

        // 發動強行跨網域 POST 請求
        fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors", // 防禦 CORS 攔截，強行送出數據
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(googlePayload)
        })
        .then(function() {
            // 🟢 【終極完勝】：落地成功！
            document.getElementById('status-title').innerText = "🎉 全自動綁定成功！";
            document.getElementById('status-title').style.color = "#00ffcc";
            document.getElementById('status-desc').innerHTML = 
                "🤝 歡迎加入 Takeitslow 特訓生態系！<br><br>" +
                "跑手 <b>" + name + "</b> 的永久同步金鑰已安全儲存至教練的雲端表格中。<br><br>" +
                "✨ <b>現在你可以放心關閉此網頁</b>，以後跑完步數據會全自動同步到教練的智慧看板！";
        })
        .catch(function(err) {
            document.getElementById('status-title').innerText = "⚠️ 寫入雲端發生未知狀態";
            document.getElementById('status-desc').innerText = "請教練至 Google 試算表檢查 'Strava_Tokens' 分頁是否已自動生成並帶入資料。";
        });
    }
</script>
</body>
</html>
