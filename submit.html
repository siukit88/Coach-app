<script>
    let submitted = false;

    // 🔒 100% 作用域安全：將所有監聽、事件、OCR 完全收攏在一體化平整空間
    window.addEventListener('DOMContentLoaded', () => {
        setupBadges('riskContainer', true);  
        setupBadges('weatherContainer', false); 
        setupBadges('supplyContainer', false);  

        // 🟢 .FIT 原始文件提取通道
        const fitFileInput = document.getElementById('fitFile');
        if (fitFileInput) {
            fitFileInput.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) return;
                const inputElement = this;
                const reader = new FileReader();
                reader.onload = function(evt) {
                    try {
                        const buffer = evt.target.result;
                        const view = new DataView(buffer);
                        let resDist = 0, resTime = 0, resClimb = 0, resHr = 0, resCad = 0;
                        let isParsed = false;

                        // 衛星滑動特徵比對（專拆三大巨頭 Session msg18）
                        for (let i = 14; i < buffer.byteLength - 40; i++) {
                            if (view.getUint8(i) === 0x40 && view.getUint8(i+1) === 0x00 && view.getUint8(i+2) > 4) {
                                let fCount = view.getUint8(i + 2);
                                let ptr = i + 3;
                                let offsets = { 5: -1, 7: -1, 16: -1, 18: -1, 25: -1 };
                                let curPos = 0;

                                for (let f = 0; f < fCount; f++) {
                                    if (ptr + 2 >= buffer.byteLength) break;
                                    let id = view.getUint8(ptr);
                                    let sz = view.getUint8(ptr + 1);
                                    if (offsets[id] !== undefined) offsets[id] = curPos;
                                    curPos += sz; ptr += 3;
                                }

                                if (offsets[5] !== -1 && offsets[7] !== -1 && ptr + curPos < buffer.byteLength) {
                                    let dStart = ptr;
                                    let d = view.getUint32(dStart + offsets[5], true) / 100000;
                                    let t = view.getUint32(dStart + offsets[7], true) / 1000;
                                    if (d > 0.1 && d < 200 && t > 10) {
                                        resDist = d; resTime = t;
                                        if (offsets[16] !== -1) resHr = view.getUint8(dStart + offsets[16]);
                                        if (offsets[18] !== -1) { let c = view.getUint8(dStart + offsets[18]); resCad = c < 120 ? c * 2 : c; }
                                        if (offsets[25] !== -1) {
                                            let c = view.getUint16(dStart + offsets[25], true);
                                            resClimb = c > 12000 ? Math.round(c / 100) : (c > 4000 ? Math.round(c / 10) : c);
                                        }
                                        isParsed = true; break;
                                    }
                                }
                            }
                        }

                        if (isParsed && resDist > 0.1) {
                            document.getElementById('distance').value = resDist.toFixed(2);
                            document.getElementById('elevation').value = (resClimb >= 0 && resClimb < 5000) ? resClimb : "0";
                            const hrs = String(Math.floor(resTime / 3600)).padStart(2, '0');
                            const mins = String(Math.floor((resTime % 3600) / 60)).padStart(2, '0');
                            const secs = String(Math.round(resTime % 60)).padStart(2, '0');
                            document.getElementById('duration').value = `${hrs}:${mins}:${secs}`;
                            document.getElementById('hr').value = resHr || "";
                            document.getElementById('cadence').value = resCad || "";
                            if (resCad > 0 && resTime > 0) { document.getElementById('stride').value = ((resDist * 1000) / (resCad * (resTime / 60))).toFixed(2); }
                            alert(`⚡ .FIT 原始檔解析成功！\n🏃 里程: ${resDist.toFixed(2)} km`);
                        } else {
                            throw new Error("格式偏移");
                        }
                    } catch(err) {
                        clearAllFields();
                        alert("❌ .FIT 文件結構高度壓縮，已自動啟用備用模式。\n💡 請改為上載手錶 App 數據截圖，將自動以 AI 抄取里程！");
                    } finally {
                        inputElement.value = '';
                    }
                };
                reader.readAsArrayBuffer(file);
            });
        }

        // 📸 終極優化：圖片智慧 OCR 自動提取抄寫
        const imgFileInput = document.getElementById('imgFile');
        if (imgFileInput) {
            imgFileInput.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) return;

                const inputElement = this;
                alert("⏳ 正在啟動智慧圖片識讀，請稍候 3-5 秒...");

                Tesseract.recognize(file, 'eng', { logger: m => console.log(m) }).then(({ data: { text } }) => {
                    console.log("OCR Output:", text);
                    // 利用正規表達式精確抓取圖片中的「數字 + km」或獨立大數字
                    const matches = text.match(/(\d+[\.,]\d+)\s*(km|kmh|mi)?/i) || text.match(/(\d+[\.,]\d+)/);
                    if (matches && matches[1]) {
                        let finalNum = matches[1].replace(',', '.');
                        document.getElementById('distance').value = parseFloat(finalNum).toFixed(2);
                        alert(`📸 圖片自動抄寫成功！\n🏃 已自動填入長距離: ${parseFloat(finalNum).toFixed(2)} km`);
                    } else {
                        alert("📸 截圖上載成功！未能自動抓到清晰里程數字，請手動輸入長距離。");
                    }
                }).catch(err => {
                    console.error(err);
                    alert("📸 截圖讀取完成！請核對並手動修正數據。");
                }).finally(() => {
                    inputElement.value = '';
                });
            });
        }

        const hiddenIframe = document.getElementById('hidden_submit_target');
        if (hiddenIframe) {
            hiddenIframe.addEventListener('load', () => {
                if (submitted) {
                    alert('🚀 功課數據（連同體感選擇）已完美同步至大數據平台！');
                    const form = document.getElementById('trainingForm');
                    if (form) form.reset();
                    resetBadges();
                }
            });
        }

        const trainingForm = document.getElementById('trainingForm');
        if (trainingForm) {
            trainingForm.addEventListener('submit', () => { submitted = true; collectBadgeValues(); });
        }
    });

    function clearAllFields() {
        document.getElementById('distance').value = "";
        document.getElementById('elevation').value = "";
        document.getElementById('duration').value = "";
        document.getElementById('hr').value = "";
        document.getElementById('cadence').value = "";
        document.getElementById('stride').value = "";
    }

    function setupBadges(containerId, isMultiple = false) {
        const container = document.getElementById(containerId);
        if (!container) return;
        container.addEventListener('click', function(e) {
            if (e.target.classList.contains('status-badge')) {
                if (!isMultiple) {
                    container.querySelectorAll('.status-badge').forEach(b => b.classList.remove('active'));
                    e.target.class
