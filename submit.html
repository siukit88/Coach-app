        .select-ctrl, .input-ctrl { width: 100%; background: #1e1e24; border: 1px solid #333; border-radius: 6px; padding: 12px; color: #fff; font-size: 15px; box-sizing: border-box; outline: none; transition: border-color 0.2s; }

<script>
    let submitted = false;

    // 🔒 100% 純淨安全初始化（不包含任何可能報錯的非標準全域變數）
    window.addEventListener('DOMContentLoaded', () => {
        setupBadges('riskContainer', true);  
        setupBadges('weatherContainer', false); 
        setupBadges('supplyContainer', false);  

        const hiddenIframe = document.getElementById('hidden_submit_target');
        if (hiddenIframe) {
            hiddenIframe.addEventListener('load', () => {
                if (submitted) {
                    alert('🚀 功課數據（連同體感選擇）已完美同步至大數據平台！');
                    const form = document.getElementById('trainingForm');
                    if (form) form.reset();
                    resetBadges();
                }
            });
        }

        const trainingForm = document.getElementById('trainingForm');
        if (trainingForm) {
            trainingForm.addEventListener('submit', () => {
                submitted = true;
                collectBadgeValues();
            });
        }
    });

    // 📡 獨立二進位解析沙盒
    const fitFileInput = document.getElementById('fitFile');
    if (fitFileInput) {
        fitFileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const inputElement = this;
            const reader = new FileReader();
            
            reader.onload = function(event) {
                try {
                    const buffer = event.target.result;
                    const view = new DataView(buffer);
                    
                    if (buffer.byteLength < 100) { throw new Error("Format error"); }

                    let resDist = null, resClimb = null, resTime = null, resHr = null, resCadence = null;
                    let isParsed = false;

                    // 🛰️ Garmin / Suunto 摘要掃描
                    for (let i = 14; i < buffer.byteLength - 60; i++) {
                        if ((view.getUint8(i) === 0x40 || view.getUint8(i) === 0x00) && view.getUint8(i+1) === 0x00) {
                            let fieldCount = view.getUint8(i + 2);
                            if (fieldCount > 5 && fieldCount < 50) {
                                let scanPointer = i + 3;
                                let distOffset = -1, climbOffset = -1, timeOffset = -1, hrOffset = -1, cadOffset = -1;
                                let currentDataPos = 0;

                                for (let f = 0; f < fieldCount; f++) {
                                    if (scanPointer + 2 >= buffer.byteLength) break;
                                    let fDefNum = view.getUint8(scanPointer);
                                    let fSize = view.getUint8(scanPointer + 1);
                                    
                                    if (fDefNum === 5)  distOffset = currentDataPos;   
                                    if (fDefNum === 25) climbOffset = currentDataPos;  
                                    if (fDefNum === 7)  timeOffset = currentDataPos;   
                                    if (fDefNum === 16) hrOffset = currentDataPos;     
                                    if (fDefNum === 18) cadOffset = currentDataPos;    
                                    
                                    currentDataPos += fSize;
                                    scanPointer += 3;
                                }

                                if (distOffset !== -1 && timeOffset !== -1 && scanPointer + currentDataPos < buffer.byteLength) {
                                    let dataStart = scanPointer;
                                    let rawDist = view.getUint32(dataStart + distOffset, true);
                                    let rawTime = view.getUint32(dataStart + timeOffset, true);
                                    
                                    let tempDist = rawDist / 100;
                                    if (tempDist > 100000) tempDist = rawDist / 100000; 

                                    if (tempDist > 0.1 && tempDist < 250) {
                                        resDist = tempDist;
                                        resTime = rawTime > 100000 ? rawTime / 1000 : rawTime;

                                        if (climbOffset !== -1) {
                                            let rawClimb = view.getUint16(dataStart + climbOffset, true);
                                            if (rawClimb > 8000) {
                                                let bigClimb = view.getUint32(dataStart + climbOffset, true);
                                                if (bigClimb < 500000) rawClimb = bigClimb;
                                            }
                                            if (rawClimb > 12000) rawClimb = Math.round(rawClimb / 100);       
                                            else if (rawClimb > 4000) rawClimb = Math.round(rawClimb / 10);    
                                            resClimb = rawClimb;
                                        }
                                        if (hrOffset !== -1) resHr = view.getUint8(dataStart + hrOffset);
                                        if (cadOffset !== -1) resCadence = view.getUint8(dataStart + cadOffset);
                                        isParsed = true;
                                        break;
                                    }
                                }
                            }
                        }
                    }

                    // 🛰️ Apple Watch 軌跡點加總
                    if (!isParsed) {
                        let maxDistRecord = 0;
                        let hrList = [], cadList = [];
                        let minTime = Infinity, maxTime = -Infinity;

                        for (let i = 14; i < buffer.byteLength - 8; i += 2) {
                            let tag = view.getUint16(i, true);
                            if (tag === 0x0504) { 
                                let dVal = view.getUint32(i + 2, true) / 100;
                                if (dVal > maxDistRecord && dVal < 250000) maxDistRecord = dVal;
                            }
                            if (tag === 0x0304) hrList.push(view.getUint8(i + 2));
                            if (tag === 0x0403) cadList.push(view.getUint8(i + 2) * 2);
                            if (tag === 0xFD04) { 
                                let tVal = view.getUint32(i + 2, true);
                                minTime = Math.min(minTime, tVal); maxTime = Math.max(maxTime, tVal);
                            }
                        }

                        if (maxDistRecord > 100) {
                            resDist = maxDistRecord / 1000; 
                            resClimb = 0; 
                            if (maxTime > minTime) resTime = maxTime - minTime;
                            if (hrList.length > 0) resHr = Math.round(hrList.reduce((a,b)=>a+b,0) / hrList.length);
                            if (cadList.length > 0) resCadence = Math.round(cadList.reduce((a,b)=>a+b,0) / cadList.length);
                            isParsed = true;
                        }
                    }

                    if (isParsed && resDist > 0.1) {
                        const finalDistance = resDist.toFixed(2);
                        const finalElevation = (resClimb && resClimb >= 0 && resClimb < 6000) ? resClimb : "0";

                        const hrs = String(Math.floor(resTime / 3600)).padStart(2, '0');
                        const mins = String(Math.floor((resTime % 3600) / 60)).padStart(2, '0');
                        const secs = String(Math.round(resTime % 60)).padStart(2, '
