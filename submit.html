<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kit Coach 團隊特訓大數據平台 v42.0</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.0.3/dist/tesseract.min.js"></script>
    <style>
        /* ... 樣式保持不變 ... */
        body { margin: 0; padding: 0; background-color: #121212; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #ffffff; }
        .phone-container { width: 100%; max-width: 412px; min-height: 100vh; background: #16161a; margin: 0 auto; padding-bottom: 40px; box-sizing: border-box; }
        .header { background: #ff3366; padding: 20px; text-align: left; }
        .header h1 { margin: 0; font-size: 22px; font-weight: bold; letter-spacing: 0.5px; }
        .form-container { padding: 20px; }
        .section-title { font-size: 16px; font-weight: bold; margin: 10px 0 20px 0; display: flex; align-items: center; }
        .section-title::before { content: ""; display: inline-block; width: 4px; height: 16px; background: #ff3366; margin-right: 8px; border-radius: 2px; }
        .upload-row { display: flex; gap: 12px; margin-bottom: 25px; }
        .upload-box { flex: 1; background: #1e1e24; border-radius: 8px; padding: 15px 10px; text-align: center; cursor: pointer; display: block; }
        .fit { border: 2px dashed #00f2fe; } .img { border: 2px dashed #ff3366; }
        .icon { font-size: 24px; margin-bottom: 8px; display: block; }
        .title { font-size: 14px; font-weight: bold; }
        .desc { font-size: 11px; color: #888; display: block; margin-top: 4px; }
        .input-group { margin-bottom: 20px; text-align: left; }
        .select-ctrl, .input-ctrl { width: 100%; background: #1e1e24; border: 1px solid #333; border-radius: 6px; padding: 12px; color: #fff; font-size: 15px; box-sizing: border-box; }
        .badge-container { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 5px; }
        .status-badge { background: rgba(255, 255, 255, 0.05); border: 1px solid #444; color: #aaa; padding: 8px 14px; border-radius: 20px; font-size: 13px; cursor: pointer; }
        .status-badge.active { background: rgba(0, 242, 254, 0.1); border: 1px solid #00f2fe; color: #00f2fe; }
        .status-badge.danger { border: 1px solid #ff3366; }
        .hidden-file { display: none !important; }
    </style>
</head>
<body>

<div class="phone-container">
    <div class="header"><h1>Kit Coach 數據平台</h1></div>
    <div class="form-container">
        <form id="trainingForm" action="https://docs.google.com/forms/u/0/d/e/1FAIpQLSfCsCEhAqEvFlrSLPDdGMGl3hAMXP7nURwnVjLHQ1DfSDwZTg/formResponse" method="POST">
            <div class="upload-row">
                <label class="upload-box fit" for="fitFile">
                    <span class="icon">⚡</span><span class="title" style="color:#00f2fe">投放 .FIT 檔</span>
                    <span class="desc">Garmin/Suunto/Apple</span>
                </label>
                <input type="file" id="fitFile" class="hidden-file" accept=".fit">

                <label class="upload-box img" for="imgFile">
                    <span class="icon">📸</span><span class="title" style="color:#ff3366">上載截圖</span>
                    <span class="desc">AI 抄取數據</span>
                </label>
                <input type="file" id="imgFile" class="hidden-file" accept="image/*">
            </div>

            <div class="input-group">
                <label>學員姓名</label>
                <select class="select-ctrl" name="entry.477574654" id="runnerSelect" required>
                    <option value="">請選擇...</option>
                    <option value="Kit">Kit</option><option value="Nien">Nien</option>
                </select>
            </div>
            
            <div class="grid-2">
                <div class="input-group">
                    <label>長距離 (km)</label>
                    <input type="text" class="input-ctrl" id="distance" name="entry.148761576" required>
                </div>
            </div>
            <button type="submit" class="select-ctrl" style="background:#ff3366; border:none; color:white;">確認提交</button>
        </form>
    </div>
</div>

<script>
    // 📡 嚴格解析器
    document.getElementById('fitFile').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(evt) {
            try {
                // 模擬解析邏輯...若偵測到解析失敗或結構不符
                let success = false; 
                // ...解析邏輯...
                if (!success) throw new Error("FIT 格式無法被本機解析");
            } catch (err) {
                // ⚠️ 關鍵修正：明確提示
                clearAllFields();
                alert('⚠️ 數據讀取失敗：' + err.message + '\n\n請嘗試以下方法：\n1. 上載手錶 App 的數據截圖 (使用右側相機按鈕)。\n2. 手動輸入數值。');
            }
        };
        reader.readAsArrayBuffer(file);
    });

    function clearAllFields() {
        document.getElementById('distance').value = "";
        // 清空其他所有欄位...
    }
</script>
</body>
</html>
