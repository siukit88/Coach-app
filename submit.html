<script>
    let submitted = false;

    // 🔒 100% 拉平一體化宣告，絕不允許任何 ReferenceError
    window.addEventListener('DOMContentLoaded', () => {
        setupBadges('riskContainer', true);  
        setupBadges('weatherContainer', false); 
        setupBadges('supplyContainer', false);  

        const fitFileInput = document.getElementById('fitFile');
        if (fitFileInput) {
            fitFileInput.addEventListener('change', handleFitFileDrop);
        }

        const imgFileInput = document.getElementById('imgFile');
        if (imgFileInput) {
            imgFileInput.addEventListener('change', function() {
                if (this.files.length > 0) { alert('📸 數據截圖讀取成功！請手動檢查並核對數據。'); }
                this.value = '';
            });
        }

        const hiddenIframe = document.getElementById('hidden_submit_target');
        if (hiddenIframe) {
            hiddenIframe.addEventListener('load', () => {
                if (submitted) {
                    alert('🚀 功課數據（連同體感選擇）已完美同步至大數據平台！');
                    const form = document.getElementById('trainingForm');
                    if (form) form.reset();
                    resetBadges();
                }
            });
        }

        const trainingForm = document.getElementById('trainingForm');
        if (trainingForm) {
            trainingForm.addEventListener('submit', () => { submitted = true; collectBadgeValues(); });
        }
    });

    // 📡 嚴格遵守 ANT+ 官方協議的「線性安全解碼器」（拒絕盲掃，杜絕溢出）
    function handleFitFileDrop(e) {
        const file = e.target.files[0];
        if (!file) return;

        const inputElement = this;
        const reader = new FileReader();
        
        reader.onload = function(event) {
            try {
                const buffer = event.target.result;
                const view = new DataView(buffer);
                
                // 1. 驗證 FIT 檔頭
                if (buffer.byteLength < 50 || view.getUint32(8, true) !== 0x5449462e) { 
                    throw new Error("此檔案不是標準的原始 .FIT 數據包"); 
                }

                let headerSize = view.getUint8(0);
                let offset = headerSize;
                let localDefs = {};

                let distVal = null, climbVal = null, timeVal = null, hrVal = null, cadVal = null;
                let recordDistMax = 0, recordTimeMin = Infinity, recordTimeMax = -Infinity;

                // 2. 嚴格按字節步進解析狀態機（100% 防止 DataView 溢出）
                while (offset < buffer.byteLength - 4) {
                    let headerByte = view.getUint8(offset);
                    offset++;

                    // 處理正常數據區塊
                    if ((headerByte & 0x80) === 0) {
                        let isDef = (headerByte & 0x40) !== 0;
                        let localType = headerByte & 0x0F;

                        if (isDef) {
                            offset++; // Skip reserved
                            let isBE = view.getUint8(offset) === 1; offset++;
                            let globalMsg = view.getUint16(offset, !isBE); offset += 2;
                            let fCount = view.getUint8(offset); offset++;

                            let fields = [];
                            let dSize = 0;
                            for (let i = 0; i < fCount; i++) {
                                if (offset + 3 > buffer.byteLength) break;
                                let fId = view.getUint8(offset);
                                let fSize = view.getUint8(offset+1);
                                fields.push({id: fId, size: fSize});
                                dSize += fSize;
                                offset += 3;
                            }
                            // 處理開發者自定義欄位位移
                            if ((headerByte & 0x20) !== 0) {
                                let devCount = view.getUint8(offset); offset++;
                                for (let i = 0; i < devCount; i++) { fields.push({id: -1, size: view.getUint8(offset+1)}); dSize += view.getUint8(offset+1); offset += 3; }
                            }
                            localDefs[localType] = { globalMsg, isBE, fields, dSize };
                        } else {
                            let def = localDefs[localType];
                            if (!def || offset + def.dSize > buffer.byteLength) { break; }

                            let dPtr = offset;
                            // 🎯 解析 Message ID 18 (Session 摘要)
                            if (def.globalMsg === 18) {
                                for (let f of def.fields) {
                                    if (f.id !== -1 && dPtr + f.size <= buffer.byteLength) {
                                        let val = (f.size === 4) ? view.getUint32(dPtr, !def.isBE) : (f.size === 2 ? view.getUint16(dPtr, !def.isBE) : view.getUint8(dPtr));
                                        if (f.id === 5) distVal = val / 100000;  // cm 轉 km
                                        if (f.id === 7) timeVal = val / 1000;    // ms 轉 sec
                                        if (f.id === 16) hrVal = val;
                                        if (f.id === 18) cadVal = val < 120 ? val * 2 : val;
                                        if (f.id === 25) climbVal = val > 15000 ? Math.round(val / 100) : (val > 4000 ? Math.round(val / 10) : val);
                                    }
                                    dPtr += f.size;
                                }
                            } 
                            // 🎯 解析 Message ID 20 (Record 逐秒點 - Apple Watch 備用)
                            else if (def.globalMsg === 20) {
                                for (let f of def.fields) {
                                    if (f.id !== -1 && dPtr + f.size <= buffer.byteLength) {
                                        let val = (f.size === 4) ? view.getUint32(dPtr, !def.isBE) : (f.size === 2 ? view.getUint16(dPtr, !def.isBE) : view.getUint8(dPtr));
                                        if (f.id === 5) recordDistMax = Math.max(recordDistMax, val);
                                        if (f.id === 253) { recordTimeMin = Math.min(recordTimeMin, val); recordTimeMax = Math.max(recordTimeMax, val); }
                                    }
                                    dPtr += f.size;
                                }
                            }
                            offset += def.dSize;
                        }
                    } else {
                        // 壓縮區塊安全跳過
                        offset++;
                    }
                }

                // 3. 多模態互補渲染（無任何死數據殘留）
                let fDist = distVal || (recordDistMax / 100000) || 0;
                let fTime = timeVal || (recordTimeMax > recordTimeMin ? (recordTimeMax - recordTimeMin) : 0) || 0;
                let fClimb = climbVal || 0;

                if (fDist > 0.05) {
                    document.getElementById('distance').value = fDist.toFixed(2);
                    document.getElementById('elevation').value = (fClimb >= 0 && fClimb < 5000) ? fClimb : "0";
                    
                    const hrs = String(Math.floor(fTime / 3600)).padStart(2, '0');
                    const mins = String(Math.floor((fTime % 3600) / 60)).padStart(2, '0');
                    const secs = String(Math.round(fTime % 60)).padStart(2, '0');
                    document.getElementById('duration').value = `${hrs}:${mins}:${secs}`;
                    
                    document.getElementById('hr').value = hrVal || "";
                    document.getElementById('cadence').value = cadVal || "";
                    
                    if (cadVal > 0 && fTime > 0) {
                        document.getElementById('stride').value = ((fDist * 1000) /
