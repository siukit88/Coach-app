<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kit Coach - .FIT 數據一鍵全自動上載</title>
    <script src="https://cdn.jsdelivr.net/npm/fit-file-parser@1.6.0/dist/@garmin/fit-file-parser.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #121212; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #ffffff; text-align: center; }
        .phone-container { width: 100%; max-width: 412px; min-height: 100vh; background: #16161a; margin: 0 auto; padding: 20px; padding-bottom: 40px; box-sizing: border-box; text-align: left; }
        .header { background: #ff3366; padding: 20px; margin: -20px -20px 20px -20px; }
        .header h1 { margin: 0; font-size: 20px; font-weight: bold; }
        .header p { margin: 5px 0 0 0; font-size: 13px; color: rgba(255,255,255,0.8); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 14px; margin-bottom: 6px; color: #aaaaaa; font-weight: bold; }
        .form-control { width: 100%; background: #2a2a35; border: 1px solid #ff3366; color: #ffffff; padding: 10px; border-radius: 4px; font-size: 15px; box-sizing: border-box; outline: none; }
        .form-control:focus { border-color: #00ffcc; }
        select.form-control { height: 42px; }
        .file-zone { border: 2px dashed #00ffcc; padding: 20px; text-align: center; border-radius: 6px; background: rgba(0,255,204,0.05); margin-bottom: 20px; cursor: pointer; }
        .file-zone p { margin: 0; font-size: 14px; color: #00ffcc; }
        .preview-box { background: #22222b; border: 1px solid #3a3a4a; padding: 12px; border-radius: 4px; font-size: 13px; color: #aaaaaa; margin-bottom: 15px; display: none; }
        .preview-title { font-weight: bold; color: #00ffcc; margin-bottom: 5px; }
        .btn-submit { background: #00ffcc; border: none; color: #121212; padding: 14px; width: 100%; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 15px; }
        .btn-submit:hover { background: #00cc99; }
        .nav-back { display: block; text-align: center; color: #ff3366; font-size: 14px; margin-top: 20px; text-decoration: none; }
        .status-msg { text-align: center; font-size: 14px; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div class="phone-container">
    <div class="header">
        <h1>🚀 FIT 數據智慧合流上載</h1>
        <p>上傳 .fit 檔自動解析，合併收集特訓問題</p>
    </div>

    <div class="form-group">
        <label>👤 學員姓名</label>
        <select id="field-name" class="form-control">
            <option value="">請選擇你的名字...</option>
            <option value="Kit">Kit</option><option value="Nein">Nein</option><option value="Simon">Simon</option>
            <option value="Alex">Alex</option><option value="Sun">Sun</option><option value="Jackson">Jackson</option>
            <option value="Joy">Joy</option><option value="George">George</option><option value="Lip">Lip</option>
            <option value="Wing_PTL">Wing_PTL</option><option value="Jason_PTL">Jason_PTL</option>
            <option value="Alwyn">Alwyn</option><option value="Camille">Camille</option><option value="Fion">Fion</option>
            <option value="Daniel">Daniel</option><option value="KingYan">KingYan</option><option value="Szero">Szero</option>
            <option value="Frances">Frances</option><option value="Bianca">Bianca</option><option value="Mabel">Mabel</option>
            <option value="Avis">Avis</option><option value="Jason">Jason</option><option value="Jerry">Jerry</option>
            <option value="Rita">Rita</option><option value="Ruby">Ruby</option><option value="Calvin Siu">Calvin Siu</option>
            <option value="Thomas">Thomas</option><option value="Yin Wai">Yin Wai</option><option value="Gary">Gary</option>
            <option value="Lois">Lois</option><option value="Gaby">Gaby</option><option value="Carol">Carol</option>
            <option value="Timothy">Timothy</option><option value="Charlotte Lokman">Charlotte Lokman</option>
            <option value="Kayan">Kayan</option>
        </select>
    </div>

    <div class="form-group">
        <label>📅 特訓週數</label>
        <input type="number" id="field-week" class="form-control" placeholder="例如：1" min="1">
    </div>

    <div class="form-group">
        <label>🏃‍♂️ 導入跑錶數據 (.fit)</label>
        <div class="file-zone" onclick="document.getElementById('fit-file-input').click()">
            <p id="file-zone-text">📱 點擊選擇或拖曳上傳 .fit 檔案</p>
            <input type="file" id="fit-file-input" accept=".fit" style="display: none;" onchange="handleFitFile(this)">
        </div>
    </div>

    <div id="fit-preview" class="preview-box">
        <div class="preview-title">📊 跑錶自動解析結果：</div>
        <div id="preview-data-text">距離: -- | 時間: -- | 心率: -- | 步頻: --</div>
    </div>

    <div class="form-group">
        <label>⚠️ 身體風險與體感問題</label>
        <select id="field-risk" class="form-control">
            <option value="良好">良好 (無痛楚、體感正常)</option>
            <option value="輕微疲勞">輕微疲勞 (肌肉正常酸痛)</option>
            <option value="關節不適">關節不適 (需特別留意)</option>
            <option value="有受傷風險">⚠️ 有受傷風險 (有痛楚，建議停練)</option>
        </select>
    </div>

    <div class="form-group">
        <label>☀️ 環境天氣</label>
        <input type="text" id="field-weather" class="form-control" placeholder="例如：晴天 / 22度">
    </div>

    <div class="form-group">
        <label>🍼 補給狀況或遇到的問題</label>
        <textarea id="field-supply" class="form-control" rows="3" placeholder="例如：第8公里抽筋 / 補水正常..."></textarea>
    </div>

    <button class="btn-submit" onclick="submitCombinedData()">🚀 全自動合流上載至 Excel</button>
    <div id="upload-status" class="status-msg"></div>

    <a href="index.html" class="nav-back">⬅️ 返回智慧數據看板</a>
</div>

<script>
    var parsedFitData = { distance: "0", time: "00:00:00", cadence: "0", stride: "0", hr: "0", climb: "0" };

    function handleFitFile(input) {
        var file = input.files[0];
        if (!file) return;
        document.getElementById('file-zone-text').innerText = "⚡ 正在解析檔案: " + file.name;
        var reader = new FileReader();
        reader.onload = function(e) {
            try {
                var arrayBuffer = e.target.result;
                var fitParser = new FitParser({ force: true, speedUnit: 'km/h', lengthUnit: 'km' });
                fitParser.parse(arrayBuffer, function(error, data) {
                    if (error) { alert("❌ FIT 檔案解析失敗"); return; }
                    if (data && data.records && data.records.length > 0) {
                        var records = data.records;
                        var totalHeartRate = 0, hrCount = 0;
                        var totalCadence = 0, cadCount = 0;
                        records.forEach(function(rec) {
                            if (rec.heart_rate) { totalHeartRate += rec.heart_rate; hrCount++; }
                            if (rec.cadence) { totalCadence += rec.cadence; cadCount++; }
                        });
                        var avgHr = hrCount > 0 ? Math.round(totalHeartRate / hrCount) : 140;
                        var avgCadence = cadCount > 0 ? Math.round(totalCadence / cadCount) : 175;
                        var totalDist = 0; var totalSeconds = 0;
                        if (data.sessions && data.sessions[0]) {
                            totalDist = data.sessions[0].total_distance || 0;
                            totalSeconds = data.sessions[0].total_elapsed_time || 0;
                        } else { totalDist = records[records.length-1].distance || 0; }
                        if (totalSeconds === 0 && records.length > 1) {
                            var start = new Date(records[0].timestamp);
                            var end = new Date(records[records.length-1].timestamp);
                            totalSeconds = Math.floor((end - start) / 1000);
                        }
                        var hrs = Math.floor(totalSeconds / 3600).toString().padStart(2, '0');
                        var mins = Math.floor((totalSeconds % 3600) / 60).toString().padStart(2, '0');
                        var secs = Math.floor(totalSeconds % 60).toString().padStart(2, '0');
                        var totalClimb = data.sessions && data.sessions[0] ? data.sessions[0].total_ascent || 0 : 50;
                        var totalMinutes = totalSeconds / 60;
                        var calculatedStride = 0.95;
                        if (avgCadence > 0 && totalMinutes > 0) {
                            calculatedStride = parseFloat(((totalDist * 1000) / (avgCadence * totalMinutes)).toFixed(2));
                        }
                        parsedFitData.distance = parseFloat(totalDist.toFixed(2));
                        parsedFitData.time = hrs + ":" + mins + ":" + secs;
                        parsedFitData.hr = avgHr; parsedFitData.cadence = avgCadence;
                        parsedFitData.stride = calculatedStride; parsedFitData.climb = Math.round(totalClimb);

                        document.getElementById('fit-preview').style.display = 'block';
                        document.getElementById('preview-data-text').innerText = 
                            "距離: " + parsedFitData.distance + "km | 時間: " + parsedFitData.time + 
                            " | 心率: " + parsedFitData.hr + "bpm | 步頻: " + parsedFitData.cadence + "spm";
                        document.getElementById('file-zone-text').innerText = "✅ .FIT 跑錶數據成功導入";
                    } else { alert("⚠ 找不到有效的運動路徑紀錄"); }
                });
            } catch(err) { alert("解析出錯: " + err.message); }
        };
        reader.readAsArrayBuffer(file);
    }

    function submitCombinedData() {
        var name = document.getElementById('field-name').value;
        var week = document.getElementById('field-week').value;
        var risk = document.getElementById('field-risk').value;
        var weather = document.getElementById('field-weather').value || "正常";
        var supply = document.getElementById('field-supply').value || "無異常";
        var statusMsg = document.getElementById('upload-status');

        if (!name || !week) { alert("❌ 請務必填寫學員姓名與特訓週數！"); return; }

        statusMsg.style.color = "#00ffcc";
        statusMsg.innerText = "⚡ 正在全自動同步至雲端 Excel...";

        var payload = {
            name: name, week: week, distance: parsedFitData.distance, time: parsedFitData.time,
            cadence: parsedFitData.cadence, stride: parsedFitData.stride, hr: parsedFitData.hr,
            climb: parsedFitData.climb, risk: risk, weather: weather, supply: supply
        };

        // 原始直接貼上網址的版本
        var googleAppsScriptUrl = "https://script.google.com/macros/s/AKfycbyemNvYJCWRVrNrZPGIyTt2Md8eqZK5R8Gqh32L844Or4p_MGy47RBXPxmuaPejXDQR/exec";

        fetch(googleAppsScriptUrl, {
            method: 'POST',
            mode: 'no-cors', 
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(function() {
            statusMsg.style.color = "#00ffcc";
            statusMsg.innerText = "🎉 恭喜！特訓功課已全自動寫入 Excel 成功！";
            document.getElementById('field-week').value = "";
            document.getElementById('field-supply').value = "";
            document.getElementById('fit-preview').style.display = 'none';
            document.getElementById('file-zone-text').innerText = "📱 點擊選擇或拖曳上傳 .fit 檔案";
        })
        .catch(function() {
            statusMsg.style.color = "#ff3366";
            statusMsg.innerText = "❌ 同步失敗，請確認網絡連線或重新整理。";
        });
    }
</script>
</body>
</html>
