<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kit Coach - 上報今日特訓功課</title>
    <style>
        body { margin: 0; padding: 0; background-color: #121212; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #ffffff; text-align: center; }
        .phone-container { width: 100%; max-width: 412px; min-height: 100vh; background: #16161a; margin: 0 auto; padding: 20px; padding-bottom: 40px; box-sizing: border-box; text-align: left; }
        .header { background: #ff3366; padding: 20px; margin: -20px -20px 20px -20px; }
        .header h1 { margin: 0; font-size: 20px; font-weight: bold; }
        .header p { margin: 5px 0 0 0; font-size: 13px; color: rgba(255,255,255,0.8); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 14px; margin-bottom: 6px; color: #aaaaaa; font-weight: bold; }
        .form-control { width: 100%; background: #2a2a35; border: 1px solid #ff3366; color: #ffffff; padding: 10px; border-radius: 4px; font-size: 15px; box-sizing: border-box; outline: none; }
        .form-control:focus { border-color: #00ffcc; }
        select.form-control { height: 42px; }
        .btn-submit { background: #ff3366; border: none; color: #ffffff; padding: 12px; width: 100%; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 15px; }
        .btn-submit:hover { background: #e02e5b; }
        .nav-back { display: block; text-align: center; color: #ff3366; font-size: 14px; margin-top: 20px; text-decoration: none; }
    </style>
</head>
<body>

<div class="phone-container">
    <div class="header">
        <h1>📝 上報今日特訓功課</h1>
        <p>慢慢跑團 遠程特訓數據同步表單</p>
    </div>

    <form action="https://docs.google.com/forms/d/e/1FAIpQLScl9Cenw6uBbeN6_76P1q9-A_LwXU8_3pQG6qL_G2vM1Y0Ulw/formResponse" method="POST" target="_self">
        
        <div class="form-group">
            <label>👤 學員姓名</label>
            <select name="entry.1848529239" class="form-control" required>
                <option value="">請選擇你的名字...</option>
                <option value="Kit">Kit</option>
                <option value="Nein">Nein</option>
                <option value="Simon">Simon</option>
                <option value="Alex">Alex</option>
                <option value="Sun">Sun</option>
                <option value="Jackson">Jackson</option>
                <option value="Joy">Joy</option>
                <option value="George">George</option>
                <option value="Lip">Lip</option>
                <option value="Wing_PTL">Wing_PTL</option>
                <option value="Jason_PTL">Jason_PTL</option>
                <option value="Alwyn">Alwyn</option>
                <option value="Camille">Camille</option>
                <option value="Fion">Fion</option>
                <option value="Daniel">Daniel</option>
                <option value="KingYan">KingYan</option>
                <option value="Szero">Szero</option>
                <option value="Frances">Frances</option>
                <option value="Bianca">Bianca</option>
                <option value="Mabel">Mabel</option>
                <option value="Avis">Avis</option>
                <option value="Jason">Jason</option>
                <option value="Jerry">Jerry</option>
                <option value="Rita">Rita</option>
                <option value="Ruby">Ruby</option>
                <option value="Calvin Siu">Calvin Siu</option>
                <option value="Thomas">Thomas</option>
                <option value="Yin Wai">Yin Wai</option>
                <option value="Gary">Gary</option>
                <option value="Lois">Lois</option>
                <option value="Gaby">Gaby</option>
                <option value="Carol">Carol</option>
                <option value="Timothy">Timothy</option>
                <option value="Charlotte Lokman">Charlotte Lokman</option>
                <option value="Kayan">Kayan</option>
            </select>
        </div>

        <div class="form-group">
            <label>📅 特訓週數</label>
            <input type="number" name="entry.1436444850" class="form-control" placeholder="例如：1" min="1" required>
        </div>

        <div class="form-group">
            <label>🏃‍♂️ 長跑距離 (km)</label>
            <input type="number" name="entry.1708819545" class="form-control" placeholder="例如：12.5" step="0.01" required>
        </div>

        <div class="form-group">
            <label>⏱️ 長跑時間 (格式必須為 HH:MM:SS)</label>
            <input type="text" name="entry.1189445163" class="form-control" placeholder="例如：01:15:30" pattern="[0-9]{2}:[0-9]{2}:[0-9]{2}" required>
        </div>

        <div class="form-group">
            <label>👟 平均步頻 (spm)</label>
            <input type="number" name="entry.1979927909" class="form-control" placeholder="例如：180" required>
        </div>

        <div class="form-group">
            <label>📏 平均步距 (米/m)</label>
            <input type="number" name="entry.159392376" class="form-control" placeholder="例如：0.95" step="0.01" required>
        </div>

        <div class="form-group">
            <label>❤️ 平均心率 (bpm)</label>
            <input type="number" name="entry.1287661073" class="form-control" placeholder="例如：142" required>
        </div>

        <div class="form-group">
            <label>⛰️ 爬升海拔 (米)</label>
            <input type="number" name="entry.1341144089" class="form-control" placeholder="例如：150" required>
        </div>

        <div class="form-group">
            <label>☀️ 環境天氣</label>
            <input type="text" name="entry.1565541604" class="form-control" placeholder="例如：晴天 / 微風 22度" required>
        </div>

        <div class="form-group">
            <label>⚠️ 身體風險與體感問題</label>
            <select name="entry.116560372" class="form-control" required>
                <option value="良好">良好 (無痛楚、體感正常)</option>
                <option value="輕微疲勞">輕微疲勞 (肌肉正常酸痛)</option>
                <option value="關節不適">關節不適 (需特別留意)</option>
                <option value="有受傷風險">⚠️ 有受傷風險 (有痛楚，建議停練)</option>
            </select>
        </div>

        <div class="form-group">
            <label>🍼 補給狀況或遇到的問題</label>
            <textarea name="entry.1972583561" class="form-control" rows="3" placeholder="例如：第8公里的時候抽筋 / 能量啫喱不夠 / 補水正常..." required></textarea>
        </div>

        <button type="submit" class="btn-submit">🚀 安全提交特訓數據</button>
    </form>

    <a href="index.html" class="nav-back">⬅️ 返回智慧數據看板</a>
</div>

</body>
</html>
