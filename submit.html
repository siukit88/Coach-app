<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kit Coach 團隊特訓大數據平台 v47.0</title>
    <style>
        body { margin: 0; padding: 0; background-color: #121212; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #ffffff; }
        .phone-container { width: 100%; max-width: 412px; min-height: 100vh; background: #16161a; margin: 0 auto; padding-bottom: 40px; box-sizing: border-box; }
        .header { background: #ff3366; padding: 20px; text-align: left; }
        .header h1 { margin: 0; font-size: 22px; font-weight: bold; letter-spacing: 0.5px; }
        .header p { margin: 5px 0 0 0; font-size: 13px; color: rgba(255,255,255,0.9); }
        .form-container { padding: 20px; }
        .section-title { font-size: 16px; font-weight: bold; margin: 10px 0 20px 0; display: flex; align-items: center; }
        .section-title::before { content: ""; display: inline-block; width: 4px; height: 16px; background: #ff3366; margin-right: 8px; border-radius: 2px; }
        .upload-row { display: flex; gap: 12px; margin-bottom: 25px; }
        .upload-box { flex: 1; background: #1e1e24; border-radius: 8px; padding: 15px 10px; text-align: center; cursor: pointer; box-sizing: border-box; }
        .upload-box.fit { border: 2px dashed #00f2fe; }
        .upload-box .icon { font-size: 24px; margin-bottom: 8px; display: block; text-align: center; width: 100%; }
        .upload-box .title { font-size: 14px; font-weight: bold; margin-bottom: 4px; color: #00f2fe; }
        .upload-box .desc { font-size: 11px; color: #888; }
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; font-size: 14px; color: #aaa; margin-bottom: 8px; }
        .select-ctrl, .input-ctrl { width: 100%; background: #1e1e24; border: 1px solid #333; border-radius: 6px; padding: 12px; color: #fff; font-size: 15px; box-sizing: border-box; outline: none; }
        .grid-2 { display: flex; gap: 12px; }
        .grid-2 .input-group { flex: 1; }
    </style>
</head>
<body>

<div class="phone-container">
    <div class="header">
        <h1>Kit Coach 團隊特訓大數據平台</h1>
        <p>慢慢跑團 遠程智慧特訓 platform v47.0</p>
    </div>

    <div class="form-container">
        <script>var submitted = false;</script>
        <iframe name="hidden_submit_target" id="hidden_submit_target" style="display:none;" onload="if(submitted){alert('🚀 功率、高度、心率核心大數據已安全發送同步！'); document.getElementById('trainingForm').reset(); submitted=false;}"></iframe>

        <form id="trainingForm" action="https://docs.google.com/forms/u/0/d/e/1FAIpQLSfCsCEhAqEvFlrSLPDdGMGl3hAMXP7nURwnVjLHQ1DfSDwZTg/formResponse" method="POST" target="hidden_submit_target" onsubmit="submitted=true;">
            <div class="section-title">📝 步驟一：學員功課手動回報</div>
            
            <div class="upload-row">
                <div class="upload-box fit" onclick="window.location.href='parser.html'">
                    <span class="icon">⚡</span>
                    <div class="title">投放 .FIT 原始檔</div>
                    <div class="desc">進入晶片動態提取中心還原真實里程公里與雙主線圖表</div>
                </div>
            </div>

            <input type="hidden" name="entry.1014260476" id="hidden_climb_stream">
            <input type="hidden" name="entry.2051690470" id="hidden_hr_stream">
            <input type="hidden" name="entry.585827917" id="hidden_power_stream">

            <div class="input-group"><label>學員姓名</label><select class="select-ctrl" name="entry.477574654" id="runnerSelect" required></select></div>
            <div class="input-group"><label>特訓密碼</label><input type="password" class="input-ctrl" name="entry.595584756" id="password" required placeholder="e.g. 1000"></div>
            <div class="input-group"><label>特訓週數</label><select class="select-ctrl" name="entry.1489498214" id="weekSelect" required></select></div>

            <div class="grid-2">
                <div class="input-group"><label>長距離 (km)</label><input type="text" class="input-ctrl" id="distance" name="entry.148761576" required></div>
                <div class="input-group"><label>爬升海拔 (米)</label><input type="text" class="input-ctrl" id="elevation" name="entry.1312042737" required></div>
            </div>
            <div class="grid-2">
                <div class="input-group"><label>長跑時間</label><input type="text" class="input-ctrl" id="duration" name="entry.1180292056" required></div>
                <div class="input-group"><label>平均步頻 (spm)</label><input type="text" class="input-ctrl" id="cadence" name="entry.1706083544" required></div>
            </div>
            <div class="grid-2">
                <div class="input-group"><label>平均心率 (bpm)</label><input type="text" class="input-ctrl" id="hr" name="entry.1835781605" required></div>
                <div class="input-group"><label>平均步距 (m)</label><input type="text" class="input-ctrl" id="stride" name="entry.772436490" required></div>
            </div>

            <div style="margin-top: 30px;">
                <button type="submit" id="submitBtn" class="select-ctrl" style="background: #ff3366; font-weight: bold; border: none; cursor: pointer; color: white;">確認提交功課 ➔</button>
            </div>
        </form>
    </div>
</div>

<script>
    window.addEventListener('DOMContentLoaded', function() {
        var runners = ["Kit", "Nien", "Simon", "Alex", "Sun", "Jackson", "Joy", "George", "Lip", "Wing_PTL", "Jason_PTL", "Alwyn", "Camille", "Fion", "Daniel", "KingYan", "Szero", "Frances", "Bianca", "Mabel", "Avis", "Jason", "Jerry", "Rita", "Ruby", "Calvin Siu", "Thomas", "Yin Wai", "Gary", "Lois", "Gaby", "Carol", "Timothy", "Charlotte Lokman", "Kayan"];
        var runnerSelect = document.getElementById('runnerSelect');
        runnerSelect.innerHTML = '<option value="">請選擇跑手...</option>';
        runners.forEach(function(name) { runnerSelect.innerHTML += '<option value="' + name + '">' + name + '</option>'; });

        var weekSelect = document.getElementById('weekSelect');
        weekSelect.innerHTML = '<option value="">請選擇特訓週數...</option>';
        for(var i = 1; i <= 40; i++) { weekSelect.innerHTML += '<option value="第 ' + i + ' 週">第 ' + i + ' 週</option>'; }

        var urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('auto')) {
            document.getElementById('distance').value = urlParams.get('dist') || "";
            document.getElementById('elevation').value = urlParams.get('climb') || "";
            document.getElementById('duration').value = urlParams.get('time') || "";
            document.getElementById('cadence').value = urlParams.get('cad') || "";
            document.getElementById('hr').value = urlParams.get('hr') || "";

            document.getElementById('hidden_climb_stream').value = urlParams.get('climb_stream') || "";
            document.getElementById('hidden_hr_stream').value = urlParams.get('hr_stream') || "";
            document.getElementById('hidden_power_stream').value = urlParams.get('power_stream') || "";
        }
    });
</script>
</body>
</html>
