<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kit Coach 功課回報主頁 v70.0</title>
    <style>
        body { margin: 0; padding: 0; background-color: #121212; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #ffffff; }
        .phone-container { width: 100%; max-width: 412px; min-height: 100vh; background: #16161a; margin: 0 auto; padding: 20px 20px 40px 20px; box-sizing: border-box; }
        .header { background: #ff3366; padding: 20px; margin: -20px -20px 20px -12px; text-align: left; color: #ffffff; }
        .header h1 { margin: 0; font-size: 20px; font-weight: bold; }
        .header p { margin: 5px 0 0 0; font-size: 12px; opacity: 0.9; }
        
        /* 推薦全自動檔案引導向區域 */
        .auto-guide-box { background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%); padding: 15px; border-radius: 8px; margin: 20px 0; color: #121212; font-weight: bold; text-align: center; cursor: pointer; box-shadow: 0 4px 15px rgba(0,242,254,0.3); }
        .auto-guide-box:URI { background: #00c6ff; }
        .auto-guide-box p { margin: 4px 0 0 0; font-size: 11px; opacity: 0.8; }

        .form-box { background: #1e1e24; border-radius: 8px; padding: 15px; margin-bottom: 20px; border: 1px solid #333; }
        .form-box h3 { margin: 0 0 15px 0; font-size: 15px; color: #ff3366; border-bottom: 1px solid #333; padding-bottom: 8px; }
        .input-group { margin-bottom: 12px; }
        .input-group:last-child { margin-bottom: 0; }
        label { display: block; font-size: 13px; color: #aaa; margin-bottom: 6px; }
        .typed-input { width: 100%; background: #16161a; border: 1px solid #444; border-radius: 4px; color: #fff; padding: 10px; font-size: 15px; font-weight: bold; box-sizing: border-box; outline: none; }
        .typed-input:focus { border-color: #ff3366; }
        .btn-submit { width: 100%; padding: 15px; background: #ff3366; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="phone-container">
    <div class="header">
        <h1> Kit Coach 功課回報系統</h1>
        <p>請提交今日特訓核心運動指標 v70.0</p>
    </div>

    <div class="auto-guide-box" onclick="window.location.href='parser.html'">
        ⚡ [推薦] 點擊此處投放 .FIT 運動檔案全自動填表
        <p>智慧解析，避免手動輸入錯誤引發數據圖表誤會</p>
    </div>

    <div class="form-box">
        <h3>📝 功課填報面板 (已支援全自動秒填 / 手動保底)</h3>
        
        <div class="input-group">
            <label>特訓長距離里程 (km)</label>
            <input type="number" step="0.01" class="typed-input" id="field_distance" placeholder="例如: 34.14">
        </div>
        
        <div class="input-group">
            <label>爬升海拔高度 (米)</label>
            <input type="number" class="typed-input" id="field_elevation" placeholder="例如: 2220">
        </div>
        
        <div class="input-group">
            <label>長跑時間 (格式: HH:MM:SS)</label>
            <input type="text" class="typed-input" id="field_duration" placeholder="例如: 06:48:21">
        </div>

        <div class="input-group">
            <label>平均心率 (bpm) - 選填</label>
            <input type="number" class="typed-input" id="field_hr" placeholder="例如: 142">
        </div>

        <div class="input-group">
            <label>平均步頻 (spm) - 選填</label>
            <input type="number" class="typed-input" id="field_cadence" placeholder="例如: 175">
        </div>
    </div>

    <button class="btn-submit" onclick="submitHomeworkV70()">🚀 確認送出功課 (生成特訓圖表)</button>
</div>

<script>
    // 📡 跨頁面 URL 參數全自動監聽秒填狀態機
    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        
        if (urlParams.has('auto')) {
            // 從網址尾巴直接打撈自動打包帶回來的數據
            const dist = urlParams.get('dist');
            const time = urlParams.get('time');
            const climb = urlParams.get('climb'); // 網計無損 2299 米
            const hr = urlParams.get('hr');
            const cad = urlParams.get('cad');

            // ⚡ 一毫秒內全自動塞滿對應格子，無需同學手動尋找或貼上
            if (dist) document.getElementById('field_distance').value = dist;
            if (time) document.getElementById('field_duration').value = time;
            if (climb) document.getElementById('field_elevation').value = climb;
            if (hr) document.getElementById('field_hr').value = hr;
            if (cad) document.getElementById('field_cadence').value = cad;

            // 變更欄位背景高亮提示同學自動秒填成功
            const fields = ['field_distance', 'field_elevation', 'field_duration', 'field_hr', 'field_cadence'];
            fields.forEach(f => {
                document.getElementById(f).style.backgroundColor = "#1f2d2f";
                document.getElementById(f).style.borderColor = "#00f2fe";
            });

            console.log("⚡ [系統通報]：已全自動將 parser 的無損計算數據（" + climb + "米）跨頁面無縫中轉填入。");
        }
    };

    function submitHomeworkV70() {
        const d = document.getElementById('field_distance').value;
        const e = document.getElementById('field_elevation').value;
        const t = document.getElementById('field_duration').value;

        if (!d || !e || !t) {
            alert('⚠️ 里程、爬升、時間為必填核心指標！\n如果自動上載失敗，請直接在此格子上手動打字輸入進行保底。');
            return;
        }

        alert('🎉 功課數據（包含計算與圖表專用爬升：' + e + '米）提交成功！\n正在引導至 Index 頁面計算 EPH 運動效率與生成無損進度圖形！');
        // 這裡後續流暢對接你的數據庫保存或 localStorage 供 index.html 渲染
    }
</script>
</body>
</html>
